<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: on Android the keyboard shrinks the
         page rather than sliding the view over it. The shell is h-dvh with the
         timeline as the one scroller, so it fits above the keyboard and the
         header, with the session's title, stays on screen. By default Chrome
         only shrinks what is visible and scrolls the page to the field,
         pushing the header off the top. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Threavia</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#5146c9" />
    <!-- Sizes rather than one file: a browser tab asks for 16 or 32, and a
         picture scaled down by the browser loses the mark it is there to show.
         Generated from brand/threavia-icon.png by brand/iconize. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <!-- The scheme, before the first paint: the module that owns it
         (src/use-theme.ts) loads after the page is drawn, and a dark page
         would flash white until then. -->
    <script>
      try {
        var theme = localStorage.getItem('threavia.theme');
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
      } catch (error) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
