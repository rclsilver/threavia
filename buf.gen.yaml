version: v2
# Generated Go code location is deterministic and tooling-driven: everything
# lands under gen/ mirroring the proto package path. Never edit it by hand, run
# `make generate`.
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen
    opt: paths=source_relative
