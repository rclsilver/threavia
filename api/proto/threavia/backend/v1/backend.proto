// BackendControl: the single long-lived bidirectional control stream between a
// BackendInstance and Core (THREAVIA_SPEC_V1.md sections 9 and 26).
//
// The backend always initiates the outbound TLS/gRPC connection; Core never
// needs inbound connectivity to a backend. The backend credential is presented
// as an "authorization: Bearer <token>" gRPC metadata header on Connect.
syntax = "proto3";

package threavia.backend.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "threavia/backend/v1/commands.proto";
import "threavia/backend/v1/common.proto";
import "threavia/backend/v1/events.proto";

option go_package = "github.com/rclsilver/threavia/gen/threavia/backend/v1;backendv1";

service BackendControl {
  rpc Connect(stream BackendToCore) returns (stream CoreToBackend);
}

// First message of the stream, sent by the backend right after connecting.
message Hello {
  ProtocolInfo protocol = 1;
  SdkInfo sdk = 2;
  BackendInfo backend = 3;
  string instance_name = 4;
  repeated Capability capabilities = 5;
  FeatureFlags features = 6;
  Capacity capacity = 7;
}

message Heartbeat {
  google.protobuf.Timestamp sent_at = 1;
  Capacity capacity = 2;
}

message StatusUpdate {
  BackendOperationalStatus status = 1;
  repeated Condition conditions = 2;
  Capacity capacity = 3;
  ProviderAuthState provider_auth_state = 4;
}

// Complete quota-only snapshot, shaped as BackendQuotas in api/openapi.yaml.
// Provider-specific limits, thresholds and metadata remain separate. Missing
// data is UNAVAILABLE or UNSUPPORTED, never interpreted as an empty balance.
// No provider credential or account profile may be included.
message QuotaReport {
  google.protobuf.Struct snapshot = 1;
}

message JobState {
  string job_id = 1;
  JobStatus status = 2;
  uint64 last_backend_sequence = 3;
}

message RunState {
  string run_id = 1;
  string native_session_id = 2;
  ResumeStatus resume_status = 3;
  repeated JobState jobs = 4;
}

// What the backend believes is actually happening locally, reported on every
// (re)connection so Core can reconcile.
message ReconcileState {
  repeated RunState runs = 1;
}

// Result of a Core -> Backend command, correlated by CoreToBackend.command_id.
message CommandResult {
  string command_id = 1;
  bool accepted = 2;
  Error error = 3;
}

// Agent-issued Core Tool call, proxied by the backend (spec section 12).
message CoreToolRequest {
  string request_id = 1;
  string run_id = 2;
  string job_id = 3;
  string name = 4;
  google.protobuf.Struct input = 5;
  // The content of the file named by the tool's file_input, read by the
  // backend. Empty for a tool that takes no file.
  bytes file = 6;
}

message BackendToCore {
  oneof message {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    StatusUpdate status_update = 3;
    ReconcileState reconcile_state = 4;
    JobEvent job_event = 5;
    EphemeralJobEvent ephemeral_job_event = 6;
    CommandResult command_result = 7;
    CoreToolRequest core_tool_request = 8;
    SkillInventory skill_inventory = 9;
    SkillFetchRequest skill_fetch_request = 10;
    WorkspaceDiff workspace_diff = 11;
    RepositoryStatus repository_status = 12;
    QuotaReport quota_report = 13;
  }
}

message CoreToBackend {
  // Correlation id for CommandResult. Empty for non-command messages.
  string command_id = 1;

  oneof message {
    Welcome welcome = 2;
    StartJob start_job = 3;
    CancelJob cancel_job = 4;
    ValidationResolution validation_resolution = 5;
    UserInputResolution user_input_resolution = 6;
    JobInputNow job_input_now = 7;
    JobInputNext job_input_next = 8;
    ReconcileInstruction reconcile_instruction = 9;
    EventAck event_ack = 10;
    CoreToolResponse core_tool_response = 11;
    SkillBundle skill_bundle = 12;
    UpdateJobPolicy update_job_policy = 13;
    WorkspaceDiffRequest workspace_diff_request = 14;
    RepositoryStatusRequest repository_status_request = 15;
  }
}

// Skills the backend has locally, reported on connection and whenever they
// change (spec section 18). Core knows the metadata and never the content: a
// local Skill may only exist behind a corporate network, and a handoff can then
// report that another backend cannot run it.
message LocalSkill {
  string name = 1;
  string description = 2;
  bool available = 3;
}

message SkillInventory {
  repeated LocalSkill local = 1;
}

// Asks Core for the bundle of a Core-managed Project Skill the backend does not
// have cached. The reply is a stream of SkillBundle chunks carrying the same
// request id.
message SkillFetchRequest {
  string request_id = 1;
  string skill_id = 2;
  string installed_revision = 3;
}

// The diff of one file, in answer to a WorkspaceDiffRequest.
message WorkspaceDiff {
  string request_id = 1;
  // A unified diff, without colour. Empty when the file did not change
  // between the two trees.
  string diff = 2;
  // Set for a file git treats as binary: there are no lines to show.
  bool binary = 3;
  // Set when the diff was cut to stay a reasonable message.
  bool truncated = 4;
  // Set instead of the diff when it cannot be computed, for instance once the
  // trees were collected by git.
  Error error = 5;
}

// Where a working directory stands in git, in answer to a
// RepositoryStatusRequest.
message RepositoryStatus {
  string request_id = 1;
  // The directory read, as this backend resolved it.
  string directory = 2;
  // False for a directory outside any git repository; nothing below is set.
  bool tracked = 3;
  // Empty when HEAD is detached.
  string branch = 4;
  // The commit checked out, abbreviated. Empty before the first commit.
  string head = 5;
  // The branch this one tracks, such as origin/main. Empty when none.
  string upstream = 6;
  // Commits only here, and only there, as of the last fetch.
  int32 ahead = 7;
  int32 behind = 8;
  // The tracked branch no longer exists on the remote.
  bool upstream_gone = 9;
  int32 staged = 10;
  int32 unstaged = 11;
  int32 untracked = 12;
  int32 conflicted = 13;
  // When the repository last fetched. Unset when it never did.
  google.protobuf.Timestamp fetched_at = 14;
  // Why a fetch asked for did not happen; the rest is the state as last known.
  string fetch_error = 15;
  // Set instead of the rest when the directory cannot be read at all.
  Error error = 16;
}
