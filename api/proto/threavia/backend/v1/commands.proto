// Core -> Backend commands (THREAVIA_SPEC_V1.md sections 9, 12, 17 and 26).
syntax = "proto3";

package threavia.backend.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "threavia/backend/v1/common.proto";

option go_package = "github.com/rclsilver/threavia/gen/threavia/backend/v1;backendv1";

// Welcome carries the connection lease. Only one connection is active for a
// BackendInstance: a newly authenticated connection supersedes the previous one
// for new commands (spec section 9).
message Welcome {
  string connection_id = 1;
  string backend_instance_id = 2;
  google.protobuf.Timestamp server_time = 3;
  uint32 heartbeat_interval_seconds = 4;
}

// ExecutionPolicy (spec section 17). Limits must be enforced by Core/backend,
// not only by prompt.
enum ExecutionMode {
  EXECUTION_MODE_UNSPECIFIED = 0;
  EXECUTION_MODE_INTERACTIVE = 1;
  EXECUTION_MODE_GUARDED = 2;
  EXECUTION_MODE_AUTONOMOUS = 3;
  // A reviewer stands in for the user where the provider has one. The refusals
  // stay refusals; a backend without one falls back to GUARDED.
  EXECUTION_MODE_SUPERVISED = 4;
}

// What a permission rule does to the action it matches.
enum PermissionEffect {
  PERMISSION_EFFECT_UNSPECIFIED = 0;
  PERMISSION_EFFECT_ALLOW = 1;
  PERMISSION_EFFECT_ASK = 2;
  PERMISSION_EFFECT_DENY = 3;
}

// What a rule is about, named independently of any provider.
//
// This is the contract: Core says "never kubectl delete" once, and each backend
// translates it into whatever its own provider understands. A rule written in a
// provider's syntax would be a rule only one backend could honour.
enum PermissionCapability {
  PERMISSION_CAPABILITY_UNSPECIFIED = 0;
  PERMISSION_CAPABILITY_SHELL = 1;
  PERMISSION_CAPABILITY_FILE_READ = 2;
  PERMISSION_CAPABILITY_FILE_WRITE = 3;
  PERMISSION_CAPABILITY_NETWORK = 4;
  PERMISSION_CAPABILITY_GIT_COMMIT = 5;
  PERMISSION_CAPABILITY_GIT_PUSH = 6;
  PERMISSION_CAPABILITY_TOOL = 7;
}

// One exception to the switches below.
message PermissionRule {
  PermissionEffect effect = 1;
  PermissionCapability capability = 2;
  // A command for SHELL, a host for NETWORK, a path for the file capabilities,
  // a name for TOOL. Empty is the whole capability, and `*` stands for any
  // text — the one wildcard every provider agrees on.
  string match = 3;
  // Why, carried so a backend can say it when it refuses.
  string note = 4;
}

message ExecutionPolicy {
  ExecutionMode mode = 1;
  bool allow_filesystem_write = 2;
  bool allow_git_commit = 3;
  bool allow_git_push = 4;
  bool allow_network = 5;
  uint32 max_duration_seconds = 6;
  uint32 max_actions = 7;
  // The fine grain, answered before the switches above: deny, then ask, then
  // allow. They arrive already merged from the Project, the Session and the
  // Job, in that order.
  repeated PermissionRule rules = 8;
  // What the reviewer of SUPERVISED is told, in the user own words. A backend
  // repeats it at the start of every Job: the reviewer re-reads the
  // conversation on each check, and a long session loses its oldest messages.
  string supervision = 9;
}

message ContextDecision {
  string id = 1;
  string title = 2;
  string content = 3;
}

message ContextTask {
  string id = 1;
  string title = 2;
  string status = 3;
}


// A Core-managed Project Skill the Run may use (spec section 18). The bundle is
// fetched separately and cached by the backend: a Job carries the identity of a
// Skill, never its content.
message ProjectSkill {
  string skill_id = 1;
  string name = 2;
  string description = 3;
  // Immutable identity of the installed version: a commit, or a content hash.
  string installed_revision = 4;
  // Checksum of the packed bundle, so a backend can tell a cached copy from a
  // stale one without fetching anything.
  string bundle_sha256 = 5;
}

// Description of one Core Tool exposed to the agent. The backend adapter maps it
// to the provider-specific tool mechanism; tool names are not hardcoded in the
// backend (spec section 12).
message CoreToolSpec {
  string name = 1;
  string description = 2;
  google.protobuf.Struct input_schema = 3;
  // When set, the input property that names a file on the backend machine.
  // The backend reads that file — within the Job's directories, and only if
  // the Job's policy lets it be read — and sends its bytes as
  // CoreToolRequest.file. Core never reaches a backend's disk itself, so this
  // is how an agent hands Core something it made: a report, an image, a page.
  string file_input = 4;
}

// Compact structured context built by Core at Run start (spec section 12).
// Never a dump of the whole project history.
message ProjectContext {
  string project_id = 1;
  string project_name = 2;
  string project_description = 3;
  // Resolved physical path of the Session working directory on this backend,
  // when one applies.
  string working_directory_path = 4;
  string known_directory_id = 5;
  // Name and git remote of that directory, so a backend with no binding can
  // resolve it rather than guess (spec section 11).
  string known_directory_name = 11;
  string known_directory_git_remote = 12;
  // Active IMPORTANT decisions only.
  repeated ContextDecision decisions = 6;
  // Compact summary of relevant open tasks only.
  repeated ContextTask tasks = 7;
  repeated CoreToolSpec tools = 8;
  // Provider-independent project instructions (spec section 18).
  string project_instructions = 9;
  // Core-managed Skills installed on the Project (spec section 18).
  repeated ProjectSkill skills = 10;
}

message StartJob {
  string project_id = 1;
  string session_id = 2;
  string run_id = 3;
  string job_id = 4;
  // Empty means: start a fresh provider native session for this Run. Otherwise
  // the backend resumes it and validates its actual existence.
  string native_session_id = 5;
  string prompt = 6;
  ProjectContext project_context = 7;
  ExecutionPolicy execution_policy = 8;
}

// Replaces the policy of a Job that is already running, after the user changed
// it. The permission gate applies it from the next tool call on. The duration
// and action limits stay those the Job started with: they bound a run that is
// already under way, and moving them mid-flight would make neither honest.
message UpdateJobPolicy {
  string run_id = 1;
  string job_id = 2;
  ExecutionPolicy execution_policy = 3;
}

message CancelJob {
  string run_id = 1;
  string job_id = 2;
  string reason = 3;
}

message ValidationResolution {
  string run_id = 1;
  string job_id = 2;
  string request_id = 3;
  bool approved = 4;
  string resolved_by_user_id = 5;
  google.protobuf.Timestamp resolved_at = 6;
  string note = 7;
}

message UserInputResolution {
  string run_id = 1;
  string job_id = 2;
  string request_id = 3;
  string value = 4;
  string resolved_by_user_id = 5;
  google.protobuf.Timestamp resolved_at = 6;
}

// Immediate interruption/reorientation. Optional CODE feature flag.
message JobInputNow {
  string run_id = 1;
  string job_id = 2;
  string text = 3;
}

// Injected as soon as practical after the current action. Optional CODE feature
// flag.
message JobInputNext {
  string run_id = 1;
  string job_id = 2;
  string text = 3;
}

enum ReconcileAction {
  RECONCILE_ACTION_UNSPECIFIED = 0;
  RECONCILE_ACTION_REPLAY_EVENTS = 1;
  RECONCILE_ACTION_REISSUE_CANCEL = 2;
  RECONCILE_ACTION_ABANDON_JOB = 3;
}

// Core is source of truth for desired logical state; the backend is source of
// truth for what actually happened locally (spec section 9).
message ReconcileInstruction {
  string run_id = 1;
  string job_id = 2;
  ReconcileAction action = 3;
  // Replay from this backend sequence, inclusive.
  uint64 from_backend_sequence = 4;
}

// Core acknowledgement of persisted backend events, up to and including
// through_backend_sequence for that Job. The backend may then drop them from its
// local durable buffer (spec section 10).
message EventAck {
  string run_id = 1;
  string job_id = 2;
  uint64 through_backend_sequence = 3;
}

message CoreToolResponse {
  string request_id = 1;
  google.protobuf.Struct result = 2;
  Error error = 3;
}

// Asks the backend for the diff of one file between the two trees a
// WorkspaceChanged reported (spec section 22). The diff never leaves the
// backend otherwise: it is computed when someone opens it, and answered with a
// WorkspaceDiff carrying the same request id.
message WorkspaceDiffRequest {
  string request_id = 1;
  string directory = 2;
  string base_tree = 3;
  string head_tree = 4;
  string path = 5;
}

// One chunk of a Skill bundle, sent in response to a SkillFetchRequest
// (spec section 18). Core distributes immutable artefacts over the protocol and
// the backend caches them locally; the bytes never travel on a Job.
message SkillBundle {
  string request_id = 1;
  string skill_id = 2;
  string installed_revision = 3;
  // Checksum of the whole bundle, verified by the backend once reassembled.
  string sha256 = 4;
  // A gzipped tar of the Agent Skills directory, split across messages.
  bytes chunk = 5;
  uint32 chunk_index = 6;
  bool last = 7;
  // Set instead of the chunks when the bundle cannot be served.
  Error error = 8;
}

// Asks the backend where a Session's working directory stands in git: branch,
// distance from its upstream, what is not committed. Answered with a
// RepositoryStatus carrying the same request id. Nothing is written, unless
// fetch is set: then the remote-tracking branches are fetched first, and only
// they change.
message RepositoryStatusRequest {
  string request_id = 1;
  // The physical path, as bound for this backend. Empty for a Session with no
  // working directory: the backend reads the one it runs such work in.
  string directory = 2;
  bool fetch = 3;
}
