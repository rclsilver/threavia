# The Threavia client API (THREAVIA_SPEC_V1.md section 5).
#
# This document is the contract, not a description written after the fact. A
# route the server registers and this file does not describe fails
# TestEveryRouteIsInTheOpenAPIDocument, and the TypeScript client is generated
# from here, so a field renamed in Go breaks the web build rather than a user's
# screen.
openapi: 3.1.0

info:
  title: Threavia Core
  # Filled in by the server with the version of the running build, which the
  # linker wrote into the binary. A release number kept in this file would be a
  # line someone has to remember to change, and the one that drifts from what is
  # actually serving.
  version: "0.0.0"
  description: |
    HTTP/JSON for commands, queries, snapshots and history; SSE for realtime
    events. No GraphQL and no WebSocket in V1.

    Every user-scoped route is checked against the authenticated caller:
    `404` covers both "does not exist" and "not yours", so an identifier cannot
    be probed for existence.

    Requests a page of another site could send are refused before they are
    handled: a JSON body not declared as `application/json` gets `415
    unsupported_media_type`, a write a browser marks as cross-site gets `403
    forbidden_origin`, and a `Host` outside `THREAVIA_HTTP_ALLOWED_HOSTS` gets
    `421 misdirected_request`. A client that is not a browser sends neither
    `Origin` nor `Sec-Fetch-Site` and is unaffected.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: The Core instance serving this document

tags:
  - name: operational
    description: Liveness, readiness and version. No authentication.
  - name: projects
    description: Projects, their directories and their instructions
  - name: sessions
    description: Sessions, their history and their execution policy
  - name: jobs
    description: Units of agent work
  - name: attention
    description: What is currently waiting for the user
  - name: knowledge
    description: Tasks, decisions and project history
  - name: artifacts
    description: Stored blobs
  - name: skills
    description: Core-managed project and global skills, and backend-local skills
  - name: backends
    description: BackendInstances and their registration
  - name: stream
    description: The global event stream

security:
  - basicAuth: []
  - bearerAuth: []

paths:
  /api/v1/sessions/{sessionId}/monitors:
    parameters:
      - in: path
        name: sessionId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [sessions]
      summary: List persistent monitors for this session
      responses:
        '200':
          description: Up to 200 most recently observed watches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Monitor' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{projectId}/monitors:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [sessions]
      summary: List persistent monitors for this project
      responses:
        '200':
          description: Up to 200 most recently observed watches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Monitor' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/monitors/{monitorId}/stop:
    parameters:
      - in: path
        name: monitorId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [sessions]
      summary: Request stopping one monitor; offline requests survive until reconnection
      responses:
        '202': { description: Stop requested; watch remains stopping until backend confirmation }
        '404': { $ref: '#/components/responses/Error' }
  /mcp:
    post:
      summary: Public Streamable HTTP MCP control endpoint
      description: Dedicated control-access Bearer token required even when UI authentication is disabled. Tools use the token owner's services and explicit scopes. Stateless, JSON responses; no cross-request MCP session identity.
      security: [{ controlAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: MCP JSON-RPC response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '202': { description: MCP notification accepted }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    get:
      summary: No standalone event stream in the stateless MCP transport
      security: [{ controlAccess: [] }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '405': { description: Use session_wait through POST instead }
    delete:
      summary: No persistent transport session to delete
      security: [{ controlAccess: [] }]
      responses:
        '401': { $ref: '#/components/responses/Error' }
        '405': { description: Stateless MCP transport }
  /api/v1/me/control-accesses:
    get:
      summary: List dedicated MCP control accesses without their secrets
      responses:
        '200':
          description: All accesses including expired or revoked records
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ControlAccess' } } } }
    post:
      summary: Create a scoped MCP access; show the generated secret once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label, scopes]
              properties:
                label: { type: string, minLength: 1, maxLength: 120 }
                scopes: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [read, manage, answer, approve] } }
                expiresAt: { type: string, format: date-time }
      responses:
        '201':
          description: Access metadata and secret; secret is not retrievable again
          content:
            application/json:
              schema: { type: object, required: [access, token], properties: { access: { $ref: '#/components/schemas/ControlAccess' }, token: { type: string } } }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/control-accesses/{accessId}:
    parameters:
      - { name: accessId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Permanently revoke an MCP access; keep the audit and bootstrap record
      responses:
        '204': { description: Revoked; repeated revocation is idempotent }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/me/mcp:
    get:
      summary: List owned external MCP declarations without secrets
      responses:
        '200':
          description: MCP operation result
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MCPServer' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      summary: Register an existing MCP server without installing or starting it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPServer' }
      responses:
        '201':
          description: MCP operation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServer' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/mcp/{serverId}:
    parameters:
      - { name: serverId, in: path, required: true, schema: { type: string } }
    put:
      summary: Replace an owned MCP declaration for subsequent Jobs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPServer' }
      responses:
        '200':
          description: MCP operation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServer' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove declaration and project bindings without uninstalling software
      responses:
        '204':
          description: MCP operation result
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/projects/{projectId}/mcp:
    parameters:
      - { name: projectId, in: path, required: true, schema: { type: string } }
    get:
      summary: List project MCP activations
      responses:
        '200':
          description: MCP operation result
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MCPBinding' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      summary: Activate or deactivate an owned MCP server in this project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPBinding' }
      responses:
        '204':
          description: MCP operation result
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/sessions/{sessionId}/mcp:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    get:
      summary: Read session restrictions on project MCP selection
      responses:
        '200':
          description: MCP operation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPRestriction' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      summary: Restrict next Jobs to selected project MCP servers; null restores inheritance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPRestriction' }
      responses:
        '204':
          description: MCP operation result
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/backends/{backendId}/mcp:
    parameters:
      - { name: backendId, in: path, required: true, schema: { type: string } }
    post:
      summary: Probe, import declarations or manage OAuth on the selected owned backend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPBackendOperation' }
      responses:
        '200':
          description: MCP operation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPBackendResult' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/sessions/{sessionId}/review:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    get:
      tags: [sessions]
      summary: Read the durable human review, including drafts and revision history
      parameters:
        - { name: revisionId, in: query, schema: { type: string } }
        - { name: compareTo, in: query, schema: { type: string }, description: 'Compute changed-file lists against this earlier revision, or initial' }
      responses:
        '200':
          description: Review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
    post:
      tags: [sessions]
      summary: Edit the review using optimistic concurrency; approval and publication are human-only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewAction' }
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/sessions/{sessionId}/review/file:
    parameters:
      - { name: sessionId, in: path, required: true, schema: { $ref: '#/components/schemas/UUID' } }
    get:
      tags: [sessions]
      summary: Read an immutable file version from a declared repository on its backend
      parameters:
        - { name: revisionId, in: query, required: true, schema: { type: string } }
        - { name: repositoryId, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: compareTo, in: query, schema: { type: string }, description: 'Earlier revision ID, or initial for the first baseline' }
      responses:
        '200':
          description: Bounded text and diff; binary and truncated flags explicitly describe omitted content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewFileContent' }
        '503': { $ref: '#/components/responses/Error' }
  /healthz:
    get:
      tags: [operational]
      summary: Liveness
      security: []
      responses:
        "200":
          description: The process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, examples: ["ok"] }

  /readyz:
    get:
      tags: [operational]
      summary: Readiness, which pings PostgreSQL
      security: []
      responses:
        "200":
          description: Ready to serve
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, examples: ["ready"] }
        "503":
          $ref: "#/components/responses/Error"

  /version:
    get:
      tags: [operational]
      summary: The Core version
      security: []
      responses:
        "200":
          description: The build version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string }

  /api/spec.yaml:
    get:
      tags: [operational]
      summary: This document
      security: []
      responses:
        "200":
          description: The OpenAPI document, in YAML
          content:
            application/yaml:
              schema: { type: string }

  /api/spec.json:
    get:
      tags: [operational]
      summary: This document, as JSON
      description: What a code generator consumes.
      security: []
      responses:
        "200":
          description: The OpenAPI document, in JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/backends/register:
    post:
      tags: [backends]
      summary: Register a BackendInstance
      description: |
        The one route a backend calls before it has any user credential. It is
        gated by a one-shot registration token or by the shared registration
        key, never by user authentication, and returns the persistent
        credential once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, capabilities]
              properties:
                name: { type: string }
                capabilities:
                  type: array
                  items: { $ref: "#/components/schemas/Capability" }
                token:
                  type: string
                  description: A one-shot user token, which owns the instance immediately.
                sharedKey:
                  type: string
                  description: The shared key, which creates an UNCLAIMED instance plus a claim code.
      responses:
        "201":
          description: The instance and its persistent credential
          content:
            application/json:
              schema:
                type: object
                required: [backendInstanceId, credential, claimed]
                properties:
                  backendInstanceId: { $ref: "#/components/schemas/UUID" }
                  credential: { type: string }
                  claimed: { type: boolean }
                  claimCode:
                    type: string
                    description: Present only when the instance is UNCLAIMED.
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/projects:
    get:
      tags: [projects]
      summary: List Projects
      parameters:
        - $ref: "#/components/parameters/IncludeArchived"
      responses:
        "200":
          description: The Projects of the caller
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
    post:
      tags: [projects]
      summary: Create a Project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        "201":
          description: The created Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [projects]
      summary: One Project
      responses:
        "200":
          description: The Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [projects]
      summary: Rename, redescribe, or set the ProjectInstructions
      description: |
        An absent or empty field keeps its current value, so editing the
        instructions does not require resending the name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                instructions:
                  type: string
                  description: Provider-independent project rules (spec section 18).
      responses:
        "200":
          description: The updated Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [projects]
      summary: Permanently delete a Project and everything it owns
      description: |
        Permanently removes the project's sessions, history, tasks, decisions,
        schedules, skills, directory bindings and artifacts. Files on backend
        machines and user-owned backends are kept. Refused while any job is
        unfinished: stop the work before deleting the project.
      responses:
        "204":
          description: Deleted
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{projectId}/archive:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      tags: [projects]
      summary: Archive a Project
      responses:
        "200":
          description: The archived Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{projectId}/restore:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      tags: [projects]
      summary: Restore an archived Project
      responses:
        "200":
          description: The restored Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{projectId}/sessions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [sessions]
      summary: The Sessions of a Project
      parameters:
        - $ref: "#/components/parameters/IncludeArchived"
      responses:
        "200":
          description: The Sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }

  /api/v1/projects/{projectId}/directories:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [projects]
      summary: The KnownDirectories of a Project, including the caller's global directories
      responses:
        "200":
          description: The directories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KnownDirectory" }
    post:
      tags: [projects]
      summary: Create a KnownDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                gitRemote:
                  type: [string, "null"]
                  description: Lets a backend offer to clone the directory when it is not present.
      responses:
        "201":
          description: The created directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownDirectory" }

  /api/v1/directories:
    get:
      tags: [projects]
      summary: The caller's global known directories
      responses:
        "200":
          description: Global directories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KnownDirectory" }
    post:
      tags: [projects]
      summary: Create a global known directory shared by the caller's projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
                gitRemote: { type: [string, "null"] }
      responses:
        "201":
          description: The created directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownDirectory" }

  /api/v1/directories/{directoryId}:
    parameters:
      - $ref: "#/components/parameters/DirectoryID"
    patch:
      tags: [projects]
      summary: Edit a known directory's metadata
      description: Omitted fields remain unchanged; empty optional fields clear their values. Does not modify backend files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                gitRemote: { type: string }
      responses:
        "200":
          description: Updated directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownDirectory" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projects]
      summary: Forget a directory and its bindings without removing files
      description: Refuses while any session uses the directory.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/directories/{directoryId}/global:
    parameters:
      - $ref: "#/components/parameters/DirectoryID"
    post:
      tags: [projects]
      summary: Make a known directory global
      description: Shares it across the owner's projects, preserving its identifier, metadata, bindings and session references. Already-global directories are returned unchanged. Refuses a global name collision.
      responses:
        "200":
          description: Global directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownDirectory" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/directories/{directoryId}/bindings/{backendId}:
    parameters:
      - $ref: "#/components/parameters/DirectoryID"
      - name: backendId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    delete:
      tags: [projects]
      summary: Forget a directory's path on one backend without removing files
      responses:
        "204": { description: Binding removed }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/directories/{directoryId}/bindings:
    parameters:
      - $ref: "#/components/parameters/DirectoryID"
    get:
      tags: [projects]
      summary: Where a directory lives on each backend
      responses:
        "200":
          description: The bindings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/KnownDirectoryBinding" }
    post:
      tags: [projects]
      summary: Bind a directory to a path on one backend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backendInstanceId, path]
              properties:
                backendInstanceId: { $ref: "#/components/schemas/UUID" }
                path:
                  type: string
                  description: An absolute path on that backend.
      responses:
        "200":
          description: The binding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnownDirectoryBinding" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/me/default-backend:
    put:
      tags: [backends]
      summary: Set the caller's default backend on this Core
      description: Shared by every client and project of this account. Null clears the preference. Revoking the backend clears it too. Offline backends remain selectable defaults; no work is moved automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backendInstanceId]
              properties:
                backendInstanceId:
                  type: [string, "null"]
                  format: uuid
      responses:
        "204": { description: Default saved; read isDefault in the backend list }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/backends:
    get:
      tags: [backends]
      summary: The BackendInstances of the caller
      responses:
        "200":
          description: The instances
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BackendInstance" }

  /api/v1/backends/{backendId}:
    parameters:
      - $ref: "#/components/parameters/BackendID"
    get:
      tags: [backends]
      summary: One BackendInstance
      responses:
        "200":
          description: The instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendInstance" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/backends/{backendId}/revoke:
    parameters:
      - $ref: "#/components/parameters/BackendID"
    post:
      tags: [backends]
      summary: Revoke the persistent credential
      description: The record stays for historical references, and a returning backend must register anew.
      responses:
        "204":
          description: Revoked
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/backends/{backendId}/skills:
    parameters:
      - $ref: "#/components/parameters/BackendID"
    get:
      tags: [skills]
      summary: The Skills that exist only on that backend
      description: |
        Core knows their metadata and never their content: a local Skill may
        only exist behind a corporate network (spec section 18).
      responses:
        "200":
          description: The local Skills
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/BackendSkill" }

  /api/v1/backends/claim:
    post:
      tags: [backends]
      summary: Claim an UNCLAIMED instance with its one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimCode]
              properties:
                claimCode: { type: string }
      responses:
        "200":
          description: The claimed instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendInstance" }
        "403":
          $ref: "#/components/responses/Error"

  /api/v1/backend-tokens:
    post:
      tags: [backends]
      summary: Issue a one-shot registration token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                ttlSeconds: { type: integer, format: int64 }
      responses:
        "201":
          description: The token, returned once
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }

  /api/v1/sessions/start:
    post:
      tags: [sessions]
      summary: The atomic first send
      description: |
        Creates the Session, its first Run, its first Job and the first message
        in one transaction, or nothing at all. A client-side draft exists only
        in the client until this call.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Channel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, backendInstanceId, message]
              properties:
                projectId: { $ref: "#/components/schemas/UUID" }
                backendInstanceId: { $ref: "#/components/schemas/UUID" }
                workingDirectoryId:
                  type: [string, "null"]
                  format: uuid
                model: { type: string, maxLength: 200, description: 'Empty uses the backend default.' }
                effort: { type: string, maxLength: 32, description: 'Provider effort value; empty uses the backend default.' }
                message: { type: string }
                artifactIds:
                  type: array
                  maxItems: 8
                  items: { $ref: "#/components/schemas/UUID" }
                  description: Files from this project attached to the prompt (3 MiB total). Requires QUEUE delivery.
                nativeSessionId:
                  type: [string, "null"]
                  description: |
                    Adopts a provider session that already exists on the chosen
                    backend, such as one started in a terminal. The first Job
                    resumes it instead of opening a fresh one. The backend can
                    only find it from the directory it was started in, so give
                    the same working directory. A session that cannot be
                    resumed fails the first Job, it does not start over.
      responses:
        "201":
          description: What the first send created
          content:
            application/json:
              schema:
                type: object
                required: [session, run, job]
                properties:
                  session: { $ref: "#/components/schemas/Session" }
                  run: { $ref: "#/components/schemas/Run" }
                  job: { $ref: "#/components/schemas/Job" }
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{sessionId}/handoff:
    get:
      tags: [sessions]
      summary: Review a destination before moving the session
      description: |
        Read-only, owner-scoped preview of the target backend, its capacity,
        capabilities, missing local Skills and working directory resolution.
        Offline targets may be chosen explicitly; work waits for reconnection.
        Full or draining targets cannot be selected. No files or native session
        are copied. State is rechecked on move; use fromRunId as expectedRunId.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
        - name: backendInstanceId
          in: query
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Destination and any reasons preventing the move
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandoffPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: The snapshot a client opens a Session with
      description: |
        State, a recent window of history, the pending attention items and the
        cursor the live stream takes over from. A client never replays the
        whole history to rebuild the present.
      parameters:
        - name: history
          in: query
          schema: { type: integer, default: 200 }
          description: How many of the most recent events to include.
      responses:
        "200":
          description: The snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Snapshot" }
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [sessions]
      summary: Rename, pin, change the working directory, or move to another backend
      description: |
        `workingDirectoryId` set to null clears the working directory, while an
        absent field leaves it alone. `backendInstanceId` moves the Session and
        answers with a handoff instead of the Session. `pinned` puts the Session
        among the ones reached from any Project, or takes it out; pinning one
        already pinned keeps its place. Changing the working directory is
        persisted for the next Job; the running process retains its cwd. It
        emits `working_directory.changed`, and clients refresh the Session and
        repository state.
        Model and effort are persisted per
        Session and apply at the next Job launch; running Jobs keep their values.
        An unsupported model or effort is refused. Model changes cannot be
        combined with a backend move in one request.
        Backend moves also cannot be combined with title, pin or directory changes.
        Optional expectedRunId refuses a move if another client already moved the
        session. Pending work (including queued Jobs), full/draining targets and
        incompatible model/effort preferences prevent a move. The new Run starts
        with bounded recent Core history; workspace files and native sessions stay
        on the source backend.
      parameters:
        - $ref: "#/components/parameters/Channel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                workingDirectoryId:
                  type: [string, "null"]
                  format: uuid
                backendInstanceId: { $ref: "#/components/schemas/UUID" }
                expectedRunId: { $ref: "#/components/schemas/UUID" }
                pinned: { type: boolean }
                model: { type: string, maxLength: 200, description: 'Empty resets to the backend default; omitted leaves it unchanged.' }
                effort: { type: string, maxLength: 32, description: 'Empty resets to the backend default; omitted leaves it unchanged.' }
      responses:
        "200":
          description: The updated Session, or the handoff when the backend changed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Session"
                  - $ref: "#/components/schemas/Handoff"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [sessions]
      summary: Delete a Session
      description: >
        Takes the Session and everything that only existed inside it — its Runs,
        Jobs, timeline and pending requests. Its Artifacts stay with the
        Project, no longer attached to a Session, unless `artifacts=delete`
        asks for them to go too. A Session with a Job still running is
        refused, because deleting it would leave that Job going on a machine
        with nowhere to report. Archiving is the reversible move.
      parameters:
        - name: artifacts
          in: query
          description: What becomes of the files made in the Session.
          schema: { type: string, enum: [keep, delete], default: keep }
      responses:
        "204":
          description: Deleted
        "409":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: Paged history of a Session
      description: |
        Walks backwards from a cursor, for a client reaching past the window its
        snapshot opened with; what happens next arrives on the stream. Each page
        is in reading order, oldest first. A page shorter than the limit is the
        beginning of the Session.
      parameters:
        - name: before
          in: query
          schema: { type: integer, format: int64 }
          description: |
            Return the events with a sequence strictly lower than this, the
            latest of them first to be picked. Absent or 0 is the end of history.
        - name: limit
          in: query
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }

  /api/v1/sessions/{sessionId}/diff:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: The diff of one file a Job changed
      description: |
        Computed by the backend that holds the working directory, when asked,
        from the two trees the workspace.changed event recorded (spec section
        22). Core keeps no diff. Only a file the event listed can be asked for.
        A backend that is offline answers 503; one whose git has since
        collected the trees answers 409.
      parameters:
        - name: event
          in: query
          required: true
          schema: { type: integer, format: int64 }
          description: The sequence of the workspace.changed event.
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: A path the event listed, relative to the top of the repository.
      responses:
        "200":
          description: The diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDiff" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{sessionId}/repository:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: Where the Session's working directory stands in git
      description: |
        Read by the backend of the Session's current Run, in the working
        directory bound there, when asked: branch, distance from its upstream,
        what is not committed. Core keeps none of it. Without fetch, ahead and
        behind compare with the remote as last fetched, and fetchedAt says
        when that was. A directory not yet located on that backend answers
        409; a backend that is offline answers 503.
      parameters:
        - name: fetch
          in: query
          schema: { type: boolean, default: false }
          description: |
            Fetch the remote first. Only the remote-tracking branches change;
            the files, the index and the branch checked out do not. A fetch
            that fails is said in fetchError, with the rest as last known.
      responses:
        "200":
          description: The state of the repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{sessionId}/messages:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [sessions]
      summary: Append a message, creating a Job or reaching the running one
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Channel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                artifactIds:
                  type: array
                  maxItems: 8
                  items: { $ref: "#/components/schemas/UUID" }
                  description: Files from this project attached to the prompt (3 MiB total). Requires QUEUE delivery.
                delivery:
                  type: string
                  enum: [QUEUE, NOW, NEXT]
                  default: QUEUE
                  description: |
                    How the message reaches a Session that is already working
                    (spec section 3.5). QUEUE makes it a Job of its own, started
                    once the running one ends. NEXT hands it to the running Job
                    at its next step; NOW interrupts that Job and reorients it.
                    Both join the running Job's timeline, need the backend to
                    announce the matching feature, and are refused with 409
                    rather than queued when nothing is running to receive them.
                    The Idempotency-Key only applies to QUEUE.
      responses:
        "201":
          description: The created Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "200":
          description: The running Job the message joined (NOW, NEXT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{sessionId}/schedules:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: The Schedules of a Session
      responses:
        "200":
          description: The Schedules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }
    post:
      tags: [sessions]
      summary: Send a message to this Session on a schedule
      description: |
        A five-field cron expression (minute hour day month weekday), read in
        the given time zone, Europe/Paris when none is given. When it comes
        due Core posts the message like any other, marked as scheduled. A run
        is skipped, and the Session says so in a schedule.skipped event, when
        the previous Job is still going, when the backend is offline, or when
        Core was not running at the time: it is never sent late, and runs do
        not stack up.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: The created Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/schedules/{scheduleId}:
    parameters:
      - name: scheduleId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    patch:
      tags: [sessions]
      summary: Change, pause or resume a Schedule
      description: Its next run is worked out again from now.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: The Schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [sessions]
      summary: Delete a Schedule; what it sent stays in the Session
      responses:
        "204":
          description: Deleted

  /api/v1/schedules/{scheduleId}/run:
    parameters:
      - name: scheduleId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    post:
      tags: [sessions]
      summary: Send a Schedule's message now
      description: |
        An explicit act, so it queues behind a running Job like any message,
        and it leaves the next planned run where it was.
      responses:
        "201":
          description: The created Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /api/v1/sessions/{sessionId}/archive:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [sessions]
      summary: Archive a Session
      responses:
        "200":
          description: The archived Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }

  /api/v1/sessions/{sessionId}/restore:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    post:
      tags: [sessions]
      summary: Restore an archived Session
      responses:
        "200":
          description: The restored Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }

  /api/v1/me/policy:
    get:
      tags: [sessions]
      summary: The caller's instance defaults for all projects and backends
      responses:
        "200":
          description: Stored defaults and effective permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
    put:
      tags: [sessions]
      summary: Set the caller's instance defaults
      description: |
        Account-scoped. Inheritance order is instance, backend, project, session,
        job. The narrowest configured level sets mode, switches, supervision and
        limits. Rules are merged; DENY cannot be lifted below. An empty object
        restores built-in defaults. Changes are sent to running jobs; a provider
        may only apply its native permissions on its next process start.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionPolicy" }
      responses:
        "200":
          description: Updated defaults
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/backends/{backendId}/policy:
    parameters:
      - name: backendId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    get:
      tags: [backends]
      summary: Backend permissions and their instance fallback
      responses:
        "200":
          description: The permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [backends]
      summary: Override the instance defaults on a backend
      description: An empty object returns to instance inheritance. Does not change the project's own settings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionPolicy" }
      responses:
        "200":
          description: Updated permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{projectId}/policy/origin:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [projects]
      summary: Project permissions and their instance fallback
      description: |
        A project has no backend of its own. Its preview uses the instance
        fallback. Sessions include the backend of their latest run before the
        project's own settings. Job permissions use the job's actual backend.
      responses:
        "200":
          description: Permissions and inheritance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyView" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{projectId}/policy:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [projects]
      summary: The ExecutionPolicy every Session of a Project inherits
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPolicy" }
    put:
      tags: [projects]
      summary: Set the default every Session of a Project inherits
      description: |
        A Session that set nothing of its own follows this from its next Job,
        and a Job already running has it pushed. An empty body resets to the
        instance defaults. When work runs, backend defaults also apply before
        the project's own settings.

        The switches are defaults a Session may loosen. A rule here with effect
        DENY is not: it is carried into every Session and answered first, so no
        Session can lift it.
      parameters:
        - $ref: "#/components/parameters/Channel"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionPolicy" }
      responses:
        "200":
          description: The policy now in force for the Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPolicy" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/sessions/{sessionId}/policy:
    parameters:
      - $ref: "#/components/parameters/SessionID"
    get:
      tags: [sessions]
      summary: The effective ExecutionPolicy of a Session, and where it comes from
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPolicy" }
    put:
      tags: [sessions]
      summary: Set what the agent may do in a Session
      description: |
        An empty body hands the Session back to its Project rather than leaving
        the previous policy in place. Limits are enforced by Core and the
        backend, never by the prompt alone (spec section 17).

        A rule that would undo a DENY written on the Project is refused: the
        Project is where a limit is set, and a Session is not allowed to reach
        past it.
      parameters:
        - $ref: "#/components/parameters/Channel"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecutionPolicy" }
      responses:
        "200":
          description: The effective policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPolicy" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/jobs/{jobId}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [jobs]
      summary: Cancel a running Job
      description: |
        The Job moves to CANCELLING and reaches CANCELLED only once the backend
        confirms it actually stopped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: The Job, now cancelling
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    delete:
      tags: [jobs]
      summary: Delete a Job that never started
      responses:
        "204":
          description: Deleted
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/auth:
    get:
      tags: [attention]
      summary: How a caller is expected to authenticate
      description: |
        Unauthenticated, and necessarily so: a client reads this to find out how
        to obtain a token at all. Core runs no login flow — a client gets its
        token from the provider and presents it here — and the web client is
        static files served by whichever Core is running, so it cannot carry the
        issuer in its own build.

        Nothing here is secret: an issuer and a client id are published by
        construction, and a public OIDC client holds no credential by design.
      security: []
      responses:
        "200":
          description: What to authenticate against
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthPublic" }

  /api/v1/me:
    get:
      tags: [attention]
      summary: The caller, as Core sees them
      description: |
        The authentication mode comes with the identity: every user-scoped row
        is attributed to a user id whether or not anyone proved who they are, so
        a client reading the id alone would present a configured development
        identity as a signed-in person.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /api/v1/me/pinned-sessions:
    get:
      tags: [sessions]
      summary: The Sessions the user pinned, from every Project
      description: |
        In the order they were pinned, each with its activeJobStatus. An
        archived Session is left out and comes back pinned when restored. A
        pin or unpin is announced by a session.pinned event, `{pinned}`.
      responses:
        "200":
          description: Pinned Sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Session" }

  /api/v1/me/attention:
    get:
      tags: [attention]
      summary: Everything currently waiting for the user
      description: |
        Current state, never a count of unread events: once an item is resolved
        it disappears from every client. Each item carries the channel that
        started the work and whether a notification is worth sending.
      parameters:
        - name: sessionId
          in: query
          schema: { $ref: "#/components/schemas/UUID" }
          description: Restrict to one Session.
      responses:
        "200":
          description: Pending attention
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attention" }

  /api/v1/me/push:
    get:
      tags: [attention]
      summary: The Web Push key to subscribe with, and the browsers subscribed
      description: |
        The public key is this Core's VAPID identity (RFC 8292), made on first
        use and kept: a browser subscribes with it as applicationServerKey.
      responses:
        "200":
          description: The push configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushConfig" }

  /api/v1/me/push/subscriptions:
    post:
      tags: [attention]
      summary: Subscribe this browser to notifications
      description: |
        The body is PushSubscription.toJSON() plus a label. Core notifies a
        subscribed browser when a validation or a question waits, and when a
        Job ends, unless the client that started the work is connected and
        already showing it. A browser subscribing again replaces its entry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionInput" }
      responses:
        "201":
          description: The subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscription" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/me/push/subscriptions/{subscriptionId}:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    delete:
      tags: [attention]
      summary: Stop notifying a browser
      responses:
        "204":
          description: Forgotten

  /api/v1/me/presence:
    post:
      tags: [attention]
      summary: Say whether the person is looking at this client
      description: |
        Sent by the client named in X-Threavia-Client when that changes: active
        means visible, focused and used in the last minutes. While the person is
        active on one of their clients no device is notified, since that screen
        already shows what happened. A stream may also declare it when it opens,
        with the X-Threavia-Active header; a client that never says is taken as
        active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/me/clients:
    get:
      tags: [attention]
      summary: The client instances of the caller with a live stream
      description: |
        One entry per instance, told apart by X-Threavia-Client and named by
        X-Threavia-Client-Name (URI-encoded), however many streams it holds.
      responses:
        "200":
          description: The connected clients
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ConnectedClient" }

  /api/v1/me/push/test:
    post:
      tags: [attention]
      summary: Send a test notification to every subscribed browser
      responses:
        "202":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [browsers]
                properties:
                  browsers: { type: integer }
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/me/audit:
    get:
      tags: [attention]
      summary: The audit trail of the caller
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100 }
        - name: projectId
          in: query
          description: Only what was done in this Project. Every Project when absent.
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: The entries, most recent first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }

  /api/v1/validations/{validationId}/resolve:
    parameters:
      - name: validationId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    post:
      tags: [attention]
      summary: Approve or deny a permission request
      description: The first valid resolution wins; a second one is told it is already resolved.
      parameters:
        - $ref: "#/components/parameters/Channel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                note: { type: string }
                channel:
                  type: string
                  description: Overrides the request channel, for a client answering on behalf of another.
      responses:
        "200":
          description: The resolved request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationRequest" }
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/user-input/{requestId}/resolve:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    post:
      tags: [attention]
      summary: Answer a question
      parameters:
        - $ref: "#/components/parameters/Channel"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string }
                channel: { type: string }
      responses:
        "200":
          description: The answered request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserInputRequest" }
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{projectId}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [knowledge]
      summary: The Tasks of a Project
      parameters:
        - name: includeDone
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The Tasks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
    post:
      tags: [knowledge]
      summary: Create a Task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                dependsOn:
                  type: array
                  items: { $ref: "#/components/schemas/UUID" }
      responses:
        "201":
          description: The created Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{projectId}/tasks/ready:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [knowledge]
      summary: The Tasks that can be started now
      description: TODO with every dependency done. Blocked is derived from the graph, never stored.
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: The ready Tasks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }

  /api/v1/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    patch:
      tags: [knowledge]
      summary: Retitle a Task, or change its status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                status: { $ref: "#/components/schemas/TaskStatus" }
      responses:
        "200":
          description: The updated Task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [knowledge]
      summary: Delete a Task
      description: >
        Takes the Task out of the Project, with the dependency edges and Job
        links that only made sense while it existed. What was done about it
        stays in the timeline.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/tasks/{taskId}/dependencies:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    post:
      tags: [knowledge]
      summary: Make a Task wait on another
      description: >
        Both Tasks must belong to the same Project, and the edge must not close
        a loop: nothing on a cycle is ever ready.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dependsOn]
              properties:
                dependsOn: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: The Task, with its dependencies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/tasks/{taskId}/dependencies/{dependsOnId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
      - name: dependsOnId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    delete:
      tags: [knowledge]
      summary: Stop a Task from waiting on another
      description: Removing an edge that is not there succeeds, so a retry is safe.
      responses:
        "200":
          description: The Task, with its dependencies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/me/decisions:
    get:
      tags: [knowledge]
      summary: Global memory shared by all the user's projects on this Core
      description: Global decisions belong to the authenticated user and survive project deletion.
      parameters:
        - name: includeSuperseded
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The global Decisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Decision" }
    post:
      tags: [knowledge]
      summary: Record a global Decision
      description: Active IMPORTANT global decisions travel with every Job across the user's projects. A replacement must have the same global scope and owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                content: { type: string }
                importance: { $ref: "#/components/schemas/DecisionImportance" }
                supersedes:
                  type: [string, "null"]
                  format: uuid
      responses:
        "201":
          description: The recorded Decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }

  /api/v1/me/memory/search:
    get:
      tags: [knowledge]
      summary: Search the user's active global facts and decisions
      description: Searches global decisions only. Session history remains scoped to its project.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Matching Decisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Decision" }

  /api/v1/projects/{projectId}/decisions:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [knowledge]
      summary: The Decisions of a Project
      parameters:
        - name: includeSuperseded
          in: query
          schema: { type: boolean, default: false }
          description: |
            Also list the Decisions that a later one replaced. Without it only
            the active ones are listed.
      responses:
        "200":
          description: The Decisions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Decision" }
    post:
      tags: [knowledge]
      summary: Record a Decision
      description: Active IMPORTANT decisions travel with every Job of the Project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                content: { type: string }
                importance: { $ref: "#/components/schemas/DecisionImportance" }
                supersedes:
                  type: [string, "null"]
                  format: uuid
      responses:
        "201":
          description: The recorded Decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }

  /api/v1/decisions/{decisionId}:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    patch:
      tags: [knowledge]
      summary: Pin or unpin a Decision
      description: >
        Changes whether the Decision travels with every Job of its Project,
        or all the user's projects when the Decision is global.
        Only the importance can change: what was decided is not edited, a
        decision that changed is superseded by a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importance]
              properties:
                importance: { $ref: "#/components/schemas/DecisionImportance" }
      responses:
        "200":
          description: The Decision as it now stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [knowledge]
      summary: Delete a Decision
      description: >
        For a Decision that should never have been recorded. Superseding is the
        move when one was changed. Whatever this Decision had superseded becomes
        current again, since nothing replaces it any more.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/decisions/{decisionId}/global:
    parameters:
      - name: decisionId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    post:
      tags: [knowledge]
      summary: Make a memory decision global
      description: Creates a global decision with the same title, content and importance, superseding the project decision atomically. The project record remains historical. An active global decision is returned unchanged; a superseded decision cannot be promoted.
      responses:
        "200":
          description: Global decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Decision" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/search:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [knowledge]
      summary: Search the project memory
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: What matched
          content:
            application/json:
              schema:
                type: object
                required: [tasks, decisions, history]
                properties:
                  tasks:
                    type: array
                    items: { $ref: "#/components/schemas/Task" }
                  decisions:
                    type: array
                    items: { $ref: "#/components/schemas/Decision" }
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/Event" }

  /api/v1/projects/{projectId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [artifacts]
      summary: The Artifacts of a Project
      description: >-
        Skill bundles are left out: they are the content of an installed Skill,
        not a user upload.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: sessionId
          in: query
          description: Only the Artifacts made in this Session.
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: The Artifacts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Artifact" }
    post:
      tags: [artifacts]
      summary: Upload an Artifact
      description: |
        A multipart form, which is what a browser sends, or a raw body, which is
        what a script sends. The checksum is computed from what was actually
        written and the object key is derived from identifiers, never from the
        filename (spec section 24).

        A sessionId must name a Session of this Project, and a jobId a Job of
        that Session; anything else is refused with 400, the same answer
        whether the id exists or not. A jobId given alone attaches the
        Artifact to the Job's Session too.
      parameters:
        - name: filename
          in: query
          schema: { type: string }
        - name: sessionId
          in: query
          schema: { $ref: "#/components/schemas/UUID" }
        - name: jobId
          in: query
          schema: { $ref: "#/components/schemas/UUID" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                sessionId: { $ref: "#/components/schemas/UUID" }
                jobId: { $ref: "#/components/schemas/UUID" }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The stored Artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      tags: [artifacts]
      summary: Artifact metadata
      responses:
        "200":
          description: The Artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [artifacts]
      summary: Remove an Artifact and the bytes behind it
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/artifacts/{artifactId}/content:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      tags: [artifacts]
      summary: The bytes of an Artifact
      description: |
        Always served as an attachment with a fixed content type: Artifacts are
        agent output, and letting a browser render one in the Threavia origin
        would turn a produced file into a script running as the user.
      responses:
        "200":
          description: The bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{projectId}/skills:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [skills]
      summary: The Core-managed Skills of a Project
      responses:
        "200":
          description: The Skills
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Skill" }
    post:
      tags: [skills]
      summary: Install a Skill from a git url, an archive url or an upload
      description: |
        A JSON body names a git or archive source; any other content type
        carries an uploaded archive. Core fetches, inspects and repacks. It
        never runs anything the source contains. A Skill of the same name in
        the Project is replaced, and takes precedence over a global one.
      parameters:
        - $ref: "#/components/parameters/SkillUploadFilename"
        - $ref: "#/components/parameters/SkillUploadName"
        - $ref: "#/components/parameters/SkillUploadPath"
      requestBody:
        $ref: "#/components/requestBodies/SkillInstall"
      responses:
        "201":
          description: The installed Skill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/projects/{projectId}/skills/{skillId}/activation:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/SkillID"
    put:
      tags: [skills]
      summary: Turn a global Skill on or off in a Project
      description: |
        Global Skills are on in every Project until turned off. The change
        applies to the next Job. A Project Skill is uninstalled rather than
        turned off, and is refused here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/me/skills:
    get:
      tags: [skills]
      summary: The global Skills of the user
      description: |
        Every Project of the user gives them to its Jobs, unless it turned one
        off or has a Skill of the same name.
      responses:
        "200":
          description: The global Skills, by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Skill" }
    post:
      tags: [skills]
      summary: Install a global Skill from a git url, an archive url or an upload
      description: |
        Same sources as a Project Skill. A global Skill of the same name is
        replaced. Its bundle belongs to the user, not to a Project.
      parameters:
        - $ref: "#/components/parameters/SkillUploadFilename"
        - $ref: "#/components/parameters/SkillUploadName"
        - $ref: "#/components/parameters/SkillUploadPath"
      requestBody:
        $ref: "#/components/requestBodies/SkillInstall"
      responses:
        "201":
          description: The installed Skill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/skills/{skillId}:
    parameters:
      - name: skillId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    delete:
      tags: [skills]
      summary: Uninstall a Skill and remove its bundle
      responses:
        "204":
          description: Uninstalled
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/skills/{skillId}/global:
    parameters:
      - $ref: "#/components/parameters/SkillID"
    post:
      tags: [skills]
      summary: Make a Project Skill global
      description: |
        Moves it, with its identifier and bundle, to the user's global Skills:
        every Project then uses it unless it turns it off. A global Skill is
        returned unchanged. Refuses a global name collision.
      responses:
        "200":
          description: The global Skill
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Skill" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/skills/{skillId}/files:
    parameters:
      - name: skillId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/UUID" }
    get:
      tags: [skills]
      summary: The files of an installed Skill
      description: >
        Read from the bundle Core stored, which is what an agent is given.
        Text files up to 256 KiB carry their content; binary or larger files
        are listed with their size only.
      responses:
        "200":
          description: The files, in bundle order
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SkillFile" }
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/events:
    get:
      tags: [stream]
      summary: The global event stream
      description: |
        One SSE stream per user carries every Session, so a client holds a
        single cursor rather than one per Session. Reconnection replays from
        that cursor: the database is the source of truth and the in-process
        broker is only the fast path.

        Frames are named, so a client listens per type rather than on the
        default `message` type:

        - `event` carries one timeline event, with the SSE `id` set to its
          global sequence, so a browser resumes with `Last-Event-ID` on its own;
        - `ephemeral` carries a liveness signal with no sequence. It is streamed
          and never stored, never advances the cursor, and says only that
          something is happening between two things worth remembering.
      parameters:
        - name: after
          in: query
          schema: { type: integer, format: int64 }
          description: Resume from this sequence. `Last-Event-ID` takes precedence.
        - $ref: "#/components/parameters/Channel"
      responses:
        "200":
          description: An endless stream of events
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }

components:
  securitySchemes:
    controlAccess:
      type: http
      scheme: bearer
      description: Dedicated scoped MCP machine access. Not accepted by the client API.
    basicAuth:
      type: http
      scheme: basic
      description: Used when THREAVIA_AUTH_MODE is basic.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An OIDC token, used when THREAVIA_AUTH_MODE is oidc. Core runs no login
        flow: a client obtains its token from the provider.

  parameters:
    ProjectID:
      name: projectId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    SessionID:
      name: sessionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    JobID:
      name: jobId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    BackendID:
      name: backendId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    DirectoryID:
      name: directoryId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    ArtifactID:
      name: artifactId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    SkillID:
      name: skillId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/UUID" }
    SkillUploadFilename:
      name: filename
      in: query
      schema: { type: string }
      description: Selects the archive format of an upload. It shapes nothing stored.
    SkillUploadName:
      name: name
      in: query
      schema: { type: string }
    SkillUploadPath:
      name: path
      in: query
      schema: { type: string }
    IncludeArchived:
      name: includeArchived
      in: query
      schema: { type: boolean, default: false }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: { type: string }
      description: |
        A retry returns what the first attempt created rather than creating a
        second one. A key belongs to the person who sent it: the same key from
        someone else is another request. Reusing a key for a message to another
        Session is refused with 409 rather than answered with the first Job.
    Channel:
      name: X-Threavia-Channel
      in: header
      schema: { $ref: "#/components/schemas/Channel" }
      description: |
        Which kind of client is calling. Core records it on the work it creates,
        so a device already following it is not also made to ring, and the audit
        trail can say where a change came from.

        Two companion headers, accepted on every route including the stream,
        tell instances of the same kind apart: X-Threavia-Client, a stable id
        the client keeps ([A-Za-z0-9_-], at most 64), and X-Threavia-Client-Name,
        the device name its person chose, URI-encoded. The stream also takes
        X-Threavia-Active (true or false), the presence when it opens.

  requestBodies:
    SkillInstall:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [source]
            properties:
              name: { type: string }
              source: { $ref: "#/components/schemas/SkillSource" }
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }
              name: { type: string }
              path: { type: string }
        application/gzip:
          schema: { type: string, format: binary }

  responses:
    Error:
      description: The single error shape of the client API
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }

  schemas:
    ControlAccess:
      type: object
      required: [id, label, scopes, createdAt, bootstrap]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        scopes: { type: array, items: { type: string, enum: [read, manage, answer, approve] } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }
        bootstrap: { type: boolean }
    MCPServer: {"type":"object","additionalProperties":false,"description":"Portable declaration. Env and headers contain backend environment variable names, never secret values. Tools are selected explicitly. writeTools is a separate human-granted exact-name list permitting selected writes without per-call approval; explicit policy denials still apply.","required":["name","transport","tools","readTools","resources","prompts","enabled","oauth"],"properties":{"revision":{"type":"integer","minimum":0,"description":"Optimistic concurrency revision; include the latest value when replacing a declaration"},"id":{"type":"string","readOnly":true},"name":{"type":"string","pattern":"^[a-z][a-z0-9_]{0,47}$"},"transport":{"type":"string","enum":["stdio","http"]},"command":{"type":"string"},"args":{"type":"array","items":{"type":"string"}},"url":{"type":"string"},"env":{"type":"object","additionalProperties":{"type":"string"}},"headers":{"type":"object","additionalProperties":{"type":"string"}},"oauth":{"type":"boolean"},"oauthClientId":{"type":"string"},"tools":{"type":"array","items":{"type":"string"}},"readTools":{"type":"array","items":{"type":"string"}},"writeTools":{"type":"array","uniqueItems":true,"items":{"type":"string"}},"resources":{"type":"boolean"},"prompts":{"type":"boolean"},"enabled":{"type":"boolean"},"projectIds":{"type":"array","items":{"type":"string"},"readOnly":true,"description":"Projects whose activations are removed when this declaration is deleted"}}}
    MCPBinding: {"type":"object","required":["serverId","enabled","required"],"properties":{"serverId":{"type":"string"},"enabled":{"type":"boolean"},"required":{"type":"boolean"}}}
    MCPRestriction: {"type":"object","required":["serverIds"],"properties":{"restricted":{"type":"boolean","readOnly":true},"serverIds":{"type":["array","null"],"items":{"type":"string"}}}}
    MCPBackendOperation: {"type":"object","required":["operation"],"properties":{"operation":{"type":"string","enum":["probe","import","auth_start","auth_finish","logout"]},"serverId":{"type":"string"},"source":{"type":"string","enum":["codex","claude"]},"redirectUri":{"type":"string"},"response":{"type":"string"},"state":{"type":"string"}}}
    MCPBackendResult: {"type":"object","additionalProperties":true,"description":"Probe result, import preview or OAuth sign-in state. Never contains tokens."}
    Review:
      type: object
      required: [sessionId, version, required, status, repositories, revisions, threads, seen, updatedAt]
      properties:
        sessionId: { type: string }
        version: { type: integer }
        required: { type: boolean }
        status: { type: string, enum: [OPEN, WAITING, CORRECTING, APPROVED] }
        correctionJobId: { type: string }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/ReviewRepository' }
        revisions:
          type: array
          items: { $ref: '#/components/schemas/ReviewRevision' }
        threads:
          type: array
          items: { $ref: '#/components/schemas/ReviewThread' }
        seen: { type: object, additionalProperties: { type: string } }
        updatedAt: { type: string, format: date-time }
    ReviewRepository:
      type: object
      required: [id, backendInstanceId, name, directory, gitDirectory, initialTree, approvedTree, baselineSource]
      properties:
        id: { type: string }
        backendInstanceId: { type: string }
        name: { type: string }
        directory: { type: string }
        gitDirectory: { type: string }
        initialTree: { type: string }
        approvedTree: { type: string }
        baselineSource: { type: string, enum: [BEFORE_WORK, DECLARED, HISTORICAL] }
    ReviewRevision:
      type: object
      required: [id, createdAt, repositories, approved]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        approved: { type: boolean }
        repositories:
          type: array
          items:
            type: object
            required: [repositoryId, baseTree, headTree, files]
            properties:
              repositoryId: { type: string }
              baseTree: { type: string }
              headTree: { type: string }
              error: { type: string }
              files:
                type: array
                items:
                  type: object
                  required: [path, state]
                  properties:
                    path: { type: string }
                    oldPath: { type: string }
                    state: { type: string, enum: [ADDED, MODIFIED, DELETED, RENAMED] }
    ReviewThread:
      type: object
      required: [id, revisionId, resolved, messages]
      properties:
        id: { type: string }
        revisionId: { type: string }
        repositoryId: { type: string }
        path: { type: string }
        side: { type: string, enum: [before, after] }
        startLine: { type: integer }
        endLine: { type: integer }
        excerpt: { type: string }
        resolved: { type: boolean }
        messages:
          type: array
          items:
            type: object
            required: [id, body, author, draft, createdAt]
            properties:
              id: { type: string }
              body: { type: string }
              author: { type: string }
              draft: { type: boolean }
              batchId: { type: string }
              createdAt: { type: string, format: date-time }
    ReviewFileContent:
      type: object
      required: [path, before, after, diff, binary, truncated]
      properties:
        path: { type: string }
        before: { type: string }
        after: { type: string }
        diff: { type: string }
        binary: { type: boolean }
        truncated: { type: boolean }
    ReviewAction:
      type: object
      required: [action, expectedVersion]
      properties:
        action: { type: string, enum: [refresh, require, approve, publish, comment, edit, delete, resolve, seen, register] }
        expectedVersion: { type: integer }
        revisionId: { type: string }
        repositoryId: { type: string }
        threadId: { type: string }
        messageId: { type: string }
        body: { type: string, maxLength: 20000 }
        path: { type: string }
        side: { type: string, enum: [before, after] }
        startLine: { type: integer, minimum: 1 }
        endLine: { type: integer, minimum: 1 }
        resolved: { type: boolean }
        directory: { type: string }
        name: { type: string }
        batchId: { type: string, description: Client-generated UUID for retry-safe publication }
    UUID:
      type: string
      format: uuid

    Channel:
      type: string
      description: |
        A loose vocabulary, not a closed enumeration: a new client must not
        require a Core release. An unknown value is recorded as `api`.
      examples: ["web", "android", "vscode", "voice", "api"]

    Capability:
      type: string
      enum: [CODE, INTERACTION, REVIEW]

    ProjectStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]

    SessionStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]

    JobStatus:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - WAITING_INPUT
        - WAITING_VALIDATION
        - WAITING_BACKEND
        - CANCELLING
        - COMPLETED
        - FAILED
        - CANCELLED

    ResumeStatus:
      type: string
      enum: [UNKNOWN, AVAILABLE, UNAVAILABLE]

    TaskStatus:
      type: string
      description: There is deliberately no BLOCKED status; blocked is derived from incomplete dependencies.
      enum: [TODO, IN_PROGRESS, DONE, CANCELLED]

    DecisionImportance:
      type: string
      enum: [NORMAL, IMPORTANT]

    DecisionStatus:
      type: string
      enum: [ACTIVE, SUPERSEDED]

    AttentionStatus:
      type: string
      enum: [PENDING, RESOLVED]

    BackendOwnershipStatus:
      type: string
      enum: [UNCLAIMED, CLAIMED, REVOKED]

    BackendOperationalStatus:
      type: string
      description: BUSY is deliberately absent; capacity is modelled separately.
      enum: [READY, DEGRADED, OFFLINE, UNAVAILABLE]

    ProviderAuthState:
      type: string
      enum: [UNKNOWN, AUTHENTICATED, AUTHENTICATION_REQUIRED]

    ExecutionMode:
      type: string
      enum: [INTERACTIVE, GUARDED, SUPERVISED, AUTONOMOUS]

    SkillSourceType:
      type: string
      enum: [GIT, ARCHIVE, UPLOAD]

    FileState:
      type: string
      enum: [ADDED, MODIFIED, DELETED, RENAMED]


    Usage:
      type: object
      description: |
        What one Job consumed, as its backend reported it. Core stores it and
        shows it; it prices nothing itself. Absent when the backend reported
        nothing: unknown accounting is not the same as a free Job.
      required: [inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens]
      properties:
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheReadTokens:
          type: integer
          format: int64
          description: Tokens served from a prompt cache. They are the bulk of a long Session.
        cacheWriteTokens: { type: integer, format: int64 }
        costUsd:
          type: number
          format: double
          description: What the provider says it cost. Absent when it says nothing.

    Project:
      type: object
      required: [id, ownerId, name, status, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        ownerId: { type: string }
        name: { type: string }
        description: { type: string }
        instructions:
          type: string
          description: Provider-independent project rules (spec section 18).
        status: { $ref: "#/components/schemas/ProjectStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time }

    Session:
      type: object
      required: [id, projectId, title, status, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        projectId: { $ref: "#/components/schemas/UUID" }
        title:
          type: string
          description: Generated, user-renamable, and with no technical meaning.
        model: { type: string, description: 'Session model preference; empty or absent uses the backend default.' }
        effort: { type: string, description: 'Session effort preference; empty or absent uses the backend default.' }
        managerSessionId:
          type: string
          format: uuid
          description: The Session that delegated this work. Absent for a conversation started by a person.
        status: { $ref: "#/components/schemas/SessionStatus" }
        workingDirectoryId:
          type: string
          format: uuid
          description: The initial cwd only, never a filesystem boundary.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time }
        pinnedAt:
          type: string
          format: date-time
          description: When the Session was pinned, to be reached from any Project. Absent when it is not.
        activeJobStatus:
          allOf: [{ $ref: "#/components/schemas/JobStatus" }]
          description: |
            The status of the oldest Job not yet finished, which everything else
            in the Session is queued behind. Absent when nothing is running or
            queued. Set on lists only, so a client can say which Session is
            working without opening each one; what waits for the user is read
            from the attention route.

    Run:
      type: object
      description: The binding between a Session and one BackendInstance. An infrastructure detail a client shows only when the user needs to choose or debug a backend.
      required: [id, sessionId, backendInstanceId, resumeStatus, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        sessionId: { $ref: "#/components/schemas/UUID" }
        backendInstanceId: { $ref: "#/components/schemas/UUID" }
        nativeSessionId: { type: string }
        resumeStatus: { $ref: "#/components/schemas/ResumeStatus" }
        resumeReason: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Job:
      type: object
      required: [id, runId, status, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        runId: { $ref: "#/components/schemas/UUID" }
        status: { $ref: "#/components/schemas/JobStatus" }
        model: { type: string, description: 'Model at launch, updated when the provider confirms it. Absent when unknown.' }
        effort: { type: string, description: 'Effort at launch, updated when the provider confirms it. Absent when unknown.' }
        originChannel: { $ref: "#/components/schemas/Channel" }
        error: { type: string }
        backendWait:
          type: object
          description: A stopped provider attempt, retained while WAITING_BACKEND. The same Job retries; waiting time consumes no execution budget.
          required: [reason, message]
          properties:
            reason: { type: string, examples: ["AUTHENTICATION_REQUIRED", "QUOTA_EXCEEDED", "RATE_LIMITED"] }
            message: { type: string }
            retryAt: { type: string, format: date-time, description: 'Earliest next attempt, not a promised quota reset.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }

    Event:
      type: object
      required: [id, sequence, timestamp, type]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        sequence:
          type: integer
          format: int64
          description: The Core-assigned global sequence, and the cursor of the stream.
        timestamp: { type: string, format: date-time }
        type: { type: string, examples: ["agent.message", "tool.started", "workspace.changed"] }
        projectId: { $ref: "#/components/schemas/UUID" }
        sessionId: { $ref: "#/components/schemas/UUID" }
        runId: { $ref: "#/components/schemas/UUID" }
        jobId: { $ref: "#/components/schemas/UUID" }
        payload:
          type: object
          additionalProperties: true
          description: |
            The shape depends on `type`, and a backend may add one without a
            Core release, so it is open. `session.model_changed` carries
            `{model, effort}` and invalidates the Session. `job.started` may
            carry provider-confirmed `{model, effort}`. `backend.models_updated`
            carries `{backendInstanceId}` and refreshes the backend catalog.
            Completion/failure events retain the Job's `{model, effort}` when
            known. The ones a client renders:

            - `backend.status_changed`: `{ backendInstanceId, operationalStatus, providerAuthState }`,
              owner-scoped and persistent; emitted after connection, disconnection,
              or a changed operational/authentication state, capacity or condition.
              Repeated reports and heartbeat timestamps do not emit events.
              Refresh backend instances, session lists, snapshots and attention.
            - `run.created`: `{ backendInstanceId, fromBackendInstanceId?, backendName? }`.
            - `run.resume_unavailable`: `{ reason }`; confirmed permanent loss, Core history preserved.
            - `run.resume_available`: `{ reason: "NEW_SESSION" | "RESUMED" }`; a fresh binding or a successful retry.
            - `run.resume_failed`: `{ reason }`; failed resume without proof of permanent loss, binding retained.
              A fromBackendInstanceId marks an explicit move: render a destination
              notice explaining the fresh provider session and bounded Core history.
              Refresh the snapshot, repository and audit. Initial runs remain silent.
            - `backend.quotas_updated`: `{ backendInstanceId }`, owner-scoped;
              refresh backend instances to read the complete quota snapshot
            - `backend.default_changed`: `{ backendInstanceId }`, owner-scoped;
              empty identifier clears the preference; refresh the backend list.
            - `monitor.changed`: session-scoped watch state or output changed; refresh monitor lists. Payload contains the watch id and state, with observation fields when available. Output is untrusted data.
            - `mcp.changed`: owner-scoped MCP declaration, activation or restriction changed; refresh MCP views. No credentials are included.
            - `control_access.changed`: `{ accessId, action: "created" | "revoked" }`, owner-scoped; refresh MCP accesses and audit. No secret or hash is included.
            - `user.message` may carry `actorId: "mcp:<accessId>"` for a remote controller, distinct from a human message and from a local delegation's `actorJobId`. The provider receives this provenance with the prompt.
            - `directory.changed`: `{ knownDirectoryId }`, owner-scoped; refresh
              directory lists and bindings after metadata or paths change.
            - `project.created`, `project.archived`, `project.restored`:
              `{ projectId, name, status }`, refresh projects and audit.
            - `project.updated`: `{ projectId, name, status?, changedFields?, previousName? }`,
              refresh project metadata and audit. Instructions and description
              contents are omitted; changedFields names what changed.
            - `project.deleted`: `{ projectId, name?, status? }`, owner-scoped
              without projectId in the envelope, surviving project deletion.
              Audit retains its project/subject identifiers and last name.
            - `task.created`, `task.updated`, `task.deleted`: `{ taskId, title, status }`,
              optionally dependsOn, changedFields, previousStatus and
              dependencyAction/dependencyTaskId/dependencyTitle. Refresh tasks
              and audit; no task description is copied into the event or audit.
            - `decision.created`, `decision.superseded`, `decision.updated`,
              `decision.deleted`: `{ decisionId, title, importance }`, optionally
              status, supersedes, supersededBy, previousProjectId (promotion),
              previousImportance or restored (an earlier fact became active
              after its replacement was deleted). Refresh memory and audit.
              Global events are owner-scoped without a project id. Fact content
              is omitted. Mutation, audit and events commit together.

            - `artifact.deleted`: `{ artifactId }`, project-scoped metadata removal
            - `skill.installed`: `{ skillId, name, installedRevision, replaced }`,
              installation or replacement. Refresh skills, open skill files and
              audit; skill content is never in the event.
            - `skill.removed`: `{ skillId, name, installedRevision }`, removal.
              Refresh skills and audit.
            - `skill.changed`: `{ skillId, name, action }`, action `made_global`
              (with previousProjectId), `enabled` or `disabled` (a global Skill
              turned on or off in the event's project, with projectName).
              Refresh skills and audit.
              Skill events are project-scoped for a Project Skill or an
              activation, owner-scoped without a project id for a global Skill.
            - `session.deleted`: `{ sessionId, title, artifactsDeleted }`,
              project-scoped so it survives deletion of the session history.
              Older events may carry the session id in the envelope instead.
              Session creation, archival, restoration and deletion are audited.
            - `user.message`: `{ text, attachments?, delivery?, scheduleId?, monitorId?, actorJobId? }`,
              attachments are `{ artifactId, filename, mimeType, size }` references; delivery NOW or
              NEXT for a message that joined a Job already running, scheduleId
              for one a Schedule sent, monitorId for a system monitoring event, actorJobId for an agent manager's message
            - `working_directory.changed`: `{ knownDirectoryId? }`, the Session's
              new working directory (absent clears it); refresh the Session,
              session lists and repository state. Applies to the next Job.
            - `session.created`: `{ title, workingDirectoryId?, managerSessionId? }`,
              managerSessionId for delegated work
            - `user_input.resolved`: `{ requestId, value, actorUserId, channel, actorJobId? }`,
              channel agent and actorJobId for an agent manager's answer
            - `schedule.skipped`: `{ scheduleId, outcome, reason, due }`, a
              scheduled message that was not sent
            - `schedule.created`, `schedule.updated`, `schedule.deleted`:
              `{ scheduleId, cron, timezone, message, enabled, actorJobId? }`,
              session-scoped schedule changes. Refresh schedules and audit.
              actorJobId identifies the originating agent Job when present.
            - `agent.message`: `{ text }`
            - `job.waiting_backend`: `{ reason, message, retryAt?, usage? }`,
              a provider attempt has stopped for authentication or quota.
              Refresh job/session state, backends and attention. The same Job
              retains its slot and can be cancelled. `job.started` clears the
              wait on resumption; terminal usage includes all prior attempts.
            - `tool.started`: `{ toolCallId, name, input }`
            - `tool.completed`: `{ toolCallId, name, output }`, the output a
              bounded excerpt marked with an ellipsis when it was cut
            - `tool.failed`: `{ toolCallId, name, error }`
            - `job.completed`, `job.failed`: `{ summary | error, usage }`
            - `workspace.changed`: `{ knownDirectoryId, files, additions,
              deletions, directory?, baseTree?, headTree? }`, the last three
              present when the diff of a file can be asked for
            - `review.changed`: `{ version, status, required }`, session-scoped
              human review changes. Refresh the review and session snapshot;
              draft bodies and code content never appear in the event.
            - `artifact.created`: `{ artifactId, filename, mimeType, size,
              title? }`, a file uploaded (Project scope) or published by an agent (Session scope)
            - `validation.resolved`: `{ validationId, approved, note, title, actorJobId? }`, title
              naming what was decided

    ConnectedClient:
      type: object
      required: [id, name, channel, active, since]
      properties:
        id: { type: string, description: Empty when the client did not identify itself. }
        name: { type: string }
        channel: { type: string }
        active: { type: boolean }
        since: { type: string, format: date-time }

    PushConfig:
      type: object
      required: [publicKey, subscriptions]
      properties:
        publicKey:
          type: string
          description: Uncompressed P-256 public key, base64url without padding.
        subscriptions:
          type: array
          items: { $ref: "#/components/schemas/PushSubscription" }

    PushSubscription:
      type: object
      required: [id, label, createdAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        label: { type: string }
        clientId:
          type: string
          description: The client instance that subscribed (X-Threavia-Client), so a device can tell its own entry.
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        lastError:
          type: string
          description: Why the last delivery failed, empty when it worked.

    PushSubscriptionInput:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          description: The push service URL the browser was given; https only.
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }
        label:
          type: string
          maxLength: 120
          description: What the person calls this device, to tell browsers apart.

    ScheduleInput:
      type: object
      description: Every field optional on a change; cron and message required on creation.
      properties:
        cron: { type: string, example: "0 8 * * mon-fri" }
        timezone: { type: string, example: Europe/Paris }
        message: { type: string }
        enabled: { type: boolean }

    Monitor:
      type: object
      description: Session-owned watch. Confirmed means its backend is connected and reported within 30 seconds; false never means confirmed running.
      required: [id, runId, jobId, sessionId, backendId, description, command, state, sequence, output, startedAt, updatedAt, expiresAt, notify, confirmed, lastSeenAt, automaticResumesRemaining]
      properties:
        id: { type: string, format: uuid }
        runId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        backendId: { type: string, format: uuid }
        description: { type: string }
        command: { type: string }
        state: { type: string, enum: [STARTING, RUNNING, STOPPING, STOPPED, COMPLETED, FAILED, EXPIRED, INTERRUPTED] }
        sequence: { type: integer }
        output: { type: string, description: Bounded tail of stdout and stderr. Untrusted command data. }
        error: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        notify: { type: boolean }
        confirmed: { type: boolean }
        automaticResumesRemaining: { type: integer, minimum: 0, maximum: 20 }

    Schedule:
      type: object
      required: [id, sessionId, cron, timezone, message, enabled, upcoming, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        sessionId: { $ref: "#/components/schemas/UUID" }
        cron: { type: string }
        timezone: { type: string }
        message: { type: string }
        enabled: { type: boolean }
        nextRunAt:
          type: string
          format: date-time
          description: Absent while paused.
        lastRunAt: { type: string, format: date-time }
        lastOutcome:
          type: string
          enum: [SENT, SKIPPED_BUSY, SKIPPED_MISSED, FAILED]
        lastJobId: { $ref: "#/components/schemas/UUID" }
        upcoming:
          type: array
          description: The next few runs, for a person to read as dates.
          items: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FileDiff:
      type: object
      required: [path, diff, binary, truncated]
      properties:
        path: { type: string }
        diff:
          type: string
          description: A unified diff without colour; empty when the file did not change.
        binary:
          type: boolean
          description: Set for a file git treats as binary, which has no lines to show.
        truncated:
          type: boolean
          description: Set when the diff was cut to stay a reasonable answer.

    Repository:
      type: object
      required: [directory, tracked, ahead, behind, upstreamGone, staged, unstaged, untracked, conflicted, checkedAt]
      properties:
        directory:
          type: string
          description: The directory read, as the backend resolved it.
        tracked:
          type: boolean
          description: False for a directory outside any git repository; nothing else is then set.
        branch:
          type: string
          description: Absent when HEAD is detached.
        head:
          type: string
          description: The commit checked out, abbreviated. Absent before the first commit.
        upstream:
          type: string
          description: The branch this one tracks, such as origin/main. Absent when none.
        ahead: { type: integer, format: int32 }
        behind: { type: integer, format: int32 }
        upstreamGone:
          type: boolean
          description: The tracked branch no longer exists on the remote.
        staged: { type: integer, format: int32 }
        unstaged: { type: integer, format: int32 }
        untracked: { type: integer, format: int32 }
        conflicted: { type: integer, format: int32 }
        fetchedAt:
          type: string
          format: date-time
          description: When the repository last fetched. Absent when it never did.
        fetchError:
          type: string
          description: Why a fetch asked for did not happen.
        checkedAt:
          type: string
          format: date-time

    Snapshot:
      type: object
      required: [session, runs, jobs, events, attention, cursor]
      properties:
        session: { $ref: "#/components/schemas/Session" }
        runs:
          type: array
          items: { $ref: "#/components/schemas/Run" }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        events:
          type: array
          items: { $ref: "#/components/schemas/Event" }
        attention: { $ref: "#/components/schemas/Attention" }
        cursor:
          type: integer
          format: int64
          description: Where the live stream takes over.

    AuthPublic:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [none, basic, oidc]
        issuer:
          type: string
          description: The OIDC issuer to obtain a token from.
        clientId:
          type: string
          description: The client id to start the flow with. Public by design.
        audience:
          type: string
          description: The audience a token must carry, when it is not the client id.

    Me:
      type: object
      required: [userId, authMode]
      properties:
        userId: { type: string }
        authMode:
          type: string
          enum: [none, basic, oidc]
          description: >
            How the caller was authenticated. "none" means nobody was asked to
            prove anything and the id is whatever Core was configured with.
        subject: { type: string }
        email: { type: string }
        name: { type: string }

    Attention:
      type: object
      required: [validations, userInputs]
      properties:
        validations:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ValidationRequest" }
        userInputs:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/UserInputRequest" }

    Scope:
      type: object
      required: [projectId, sessionId, runId, jobId]
      properties:
        projectId: { $ref: "#/components/schemas/UUID" }
        sessionId: { $ref: "#/components/schemas/UUID" }
        runId: { $ref: "#/components/schemas/UUID" }
        jobId: { $ref: "#/components/schemas/UUID" }

    ValidationRequest:
      type: object
      description: A permission request. It waits indefinitely and the first valid resolution wins.
      required: [id, scope, status, title, requestPayload, payloadSha256, createdAt, notify]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        scope: { $ref: "#/components/schemas/Scope" }
        status: { $ref: "#/components/schemas/AttentionStatus" }
        title: { type: string }
        summary: { type: string }
        requestPayload:
          type: object
          additionalProperties: true
          description: The canonical technical request. A technical client renders it.
        payloadSha256:
          type: string
          description: The security reference of the validation receipt.
        humanized: { type: string }
        originChannel: { $ref: "#/components/schemas/Channel" }
        notify:
          type: boolean
          description: False while the client that started the work still holds a live stream.
        context: { $ref: "#/components/schemas/AttentionContext" }
        approved: { type: boolean }
        resolvedByUserId: { type: string }
        resolvedChannel: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }

    AttentionContext:
      type: object
      description: Where a pending request comes from, in the words a person deciding it needs. Derived when read.
      required: [sessionTitle, projectName, backendName]
      properties:
        sessionTitle: { type: string }
        projectName: { type: string }
        backendName: { type: string }
        directory: { type: string, description: "The session's KnownDirectory, absent when it has none." }

    UserInputRequest:
      type: object
      description: A request for an answer, a choice or information. Distinct from a permission request.
      required: [id, scope, status, prompt, freeText, createdAt, notify]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        scope: { $ref: "#/components/schemas/Scope" }
        status: { $ref: "#/components/schemas/AttentionStatus" }
        prompt: { type: string }
        choices:
          type: array
          items: { type: string }
        freeText: { type: boolean }
        originChannel: { $ref: "#/components/schemas/Channel" }
        notify: { type: boolean }
        context: { $ref: "#/components/schemas/AttentionContext" }
        value: { type: string }
        resolvedByUserId: { type: string }
        resolvedChannel: { type: string }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }

    ExecutionPolicy:
      type: object
      description: |
        What an agent may do. The default is the most restrained of the three
        modes: a policy that has to be loosened on purpose is a policy someone
        thought about. It is a guard rail, not a sandbox: filesystem and process
        access stay the real permissions of the backend account.

        The gate reads a command as written, so an agent determined to evade it
        can, and in AUTONOMOUS mode the agent acts with that account's full
        rights without asking. Where the real boundary lies, the ways around the
        gate and how to run a backend for AUTONOMOUS work are in "What the
        policy does not do" in docs/architecture.md.
      required: [mode, allowFilesystemWrite, allowGitCommit, allowGitPush, allowNetwork]
      properties:
        mode: { $ref: "#/components/schemas/ExecutionMode" }
        allowFilesystemWrite: { type: boolean }
        allowGitCommit: { type: boolean }
        allowGitPush: { type: boolean }
        allowNetwork: { type: boolean }
        rules:
          type: array
          description: |
            The fine grain, answered before the switches above: deny, then ask,
            then allow. On a read they arrive already merged from the Project
            and the Session, outermost first.
          items: { $ref: "#/components/schemas/PermissionRule" }
        supervision:
          type: string
          maxLength: 4000
          description: |
            What the reviewer of SUPERVISED is told, in the user's own words:
            what counts as ordinary work here and what it should stop.

            Not the Project instructions, and it must not become them. Those
            address the agent — how to work in this repository — and reach it
            through the provider's system prompt, which the reviewer does not
            read. This addresses the reviewer, and reaches it the only way
            anything does: as something the user said. A backend repeats it at
            the start of every Job, because the reviewer re-reads the
            conversation on each check and a long session loses its oldest
            messages.

            A statement, never a guarantee: a rule is what holds whatever the
            conversation looks like.
        maxDurationSeconds:
          type: integer
          description: Stops a Run that has been going too long. Zero means no limit.
        maxActions:
          type: integer
          description: Stops a Run that has taken too many steps. Zero means no limit.

    PermissionEffect:
      type: string
      description: What a rule does to the action it matches. DENY never asks — the answer was given in advance.
      enum: [ALLOW, ASK, DENY]

    PermissionCapability:
      type: string
      description: |
        What a rule is about, named independently of any provider. This is the
        contract: a Project says "never kubectl delete" once, and each backend
        translates it into whatever its own provider understands. A rule written
        in a provider's syntax would be a rule only one backend could honour.
      enum: [SHELL, FILE_READ, FILE_WRITE, NETWORK, GIT_COMMIT, GIT_PUSH, TOOL]

    PermissionRule:
      type: object
      description: |
        One exception to the switches of an ExecutionPolicy.

        A rule written on a Project with effect DENY is binding: it travels into
        every Session below and is answered first, so no Session can take it out
        of the set. The switches are not — they are defaults a Session may
        loosen. That is the difference between a convenience and a limit.
      required: [effect, capability]
      properties:
        effect: { $ref: "#/components/schemas/PermissionEffect" }
        capability: { $ref: "#/components/schemas/PermissionCapability" }
        match:
          type: string
          maxLength: 512
          description: |
            A command for SHELL, a host for NETWORK, a path for the file
            capabilities, a name for TOOL. Empty is the whole capability, and
            `*` stands for any text — the one wildcard every provider agrees on.
            Required for TOOL, which otherwise names no tool.
        note:
          type: string
          maxLength: 512
          description: Why. Kept for the audit and shown beside the rule, because a rule nobody can explain is a rule nobody dares remove.

    PolicyView:
      type: object
      description: A level's own settings, effective permissions and fallback.
      required: [effective, parent, inherited]
      properties:
        effective: { $ref: "#/components/schemas/ExecutionPolicy" }
        parent: { $ref: "#/components/schemas/ExecutionPolicy" }
        inherited: { type: boolean }
        own: { $ref: "#/components/schemas/ExecutionPolicy" }

    SessionPolicy:
      type: object
      description: What applies to a Session, and where it comes from.
      required: [effective, inherited, project]
      properties:
        effective:
          allOf: [{ $ref: "#/components/schemas/ExecutionPolicy" }]
          description: What actually applies, the Project refusals included.
        inherited:
          type: boolean
          description: |
            The Session set nothing of its own and follows its Project, live:
            changing the Project changes this Session.
        project:
          allOf: [{ $ref: "#/components/schemas/ExecutionPolicy" }]
          description: What it falls back to, so a client can offer to return to it.
        own:
          allOf: [{ $ref: "#/components/schemas/ExecutionPolicy" }]
          description: |
            What this Session set, and nothing it inherited. Absent while it
            follows its Project. A client that edits the effective policy edits
            the Project's rules into the Session, quietly turning an inherited
            rule into a copy that stops following it.

    KnownDirectory:
      type: object
      description: |
        A logical directory belonging to a project or, when projectId is absent,
        to the caller globally across their projects. Portability and discovery metadata,
        never a sandbox: the agent may work in any directory the backend
        filesystem allows.
      required: [id, name, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        projectId: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: string }
        gitRemote: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    KnownDirectoryBinding:
      type: object
      description: Where a logical directory actually lives on one backend. The same directory has different paths on different backends.
      required: [knownDirectoryId, backendInstanceId, path, createdAt, updatedAt]
      properties:
        knownDirectoryId: { $ref: "#/components/schemas/UUID" }
        backendInstanceId: { $ref: "#/components/schemas/UUID" }
        path: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Capacity:
      type: object
      required: [maxConcurrentRuns, activeRuns]
      properties:
        maxConcurrentRuns: { type: integer }
        activeRuns: { type: integer }

    Condition:
      type: object
      description: Why a backend is in the state it reports, in the vocabulary the backend chose. Core stores it without interpreting it.
      required: [type, status, observedAt]
      properties:
        type: { type: string, examples: ["ProviderAvailable"] }
        status: { type: string, examples: ["False"] }
        reason: { type: string, examples: ["ExecutableNotFound"] }
        message: { type: string }
        observedAt: { type: string, format: date-time }

    BackendInstance:
      type: object
      description: An autonomous remote execution participant. It belongs to a User, not to a Project.
      required: [id, name, ownershipStatus, operationalStatus, providerAuthState, capabilities, capacity, protocolVersion, createdAt, updatedAt]
      properties:
        isDefault:
          type: boolean
          description: The caller's default backend across their projects and clients on this Core; absent means false.
        id: { $ref: "#/components/schemas/UUID" }
        ownerId:
          type: string
          description: Absent while the instance is UNCLAIMED.
        name: { type: string }
        backend:
          type: string
          description: Provider identifier announced in Hello, such as claude or codex. Empty before the first connection; clients must handle unknown providers.
        modelCatalog: { $ref: "#/components/schemas/ModelCatalog" }
        quotas: { $ref: "#/components/schemas/BackendQuotas" }
        ownershipStatus: { $ref: "#/components/schemas/BackendOwnershipStatus" }
        operationalStatus: { $ref: "#/components/schemas/BackendOperationalStatus" }
        providerAuthState: { $ref: "#/components/schemas/ProviderAuthState" }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/Capability" }
        features:
          type: array
          description: |
            The optional CODE features announced on the last connection (spec
            sections 3.5 and 7): whether a message can reach a Job while it
            runs, after interrupting it or at its next step, prompt attachments,
            and per-session model selection.
          items:
            type: string
            enum: [JOB_INPUT_NOW, JOB_INPUT_NEXT, PROMPT_ATTACHMENTS, MODEL_SELECTION, HUMAN_REVIEW, EXTERNAL_MCP, PERSISTENT_MONITORS]
        capacity: { $ref: "#/components/schemas/Capacity" }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/Condition" }
        protocolVersion: { type: integer }
        lastHeartbeatAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time }

    ModelCatalog:
      type: object
      required: [models]
      properties:
        defaultModel: { type: string }
        defaultEffort: { type: string }
        models:
          type: array
          items:
            type: object
            required: [id, name, efforts]
            properties:
              id: { type: string }
              name: { type: string }
              efforts: { type: array, items: { type: string } }
              defaultEffort: { type: string }

    BackendQuotas:
      type: object
      description: A complete provider quota snapshot. Every limit and provider-specific threshold is kept independently; absence never means zero usage. Credentials are never included.
      required: [availability, observedAt, limits]
      properties:
        availability: { type: string, enum: [AVAILABLE, UNAVAILABLE, UNSUPPORTED] }
        observedAt: { type: string, format: date-time }
        message: { type: string }
        limits:
          type: array
          items: { $ref: "#/components/schemas/BackendQuota" }
        details:
          type: object
          additionalProperties: true
          description: Additional quota-only information supplied by the provider, including credits or overage settings.

    BackendQuota:
      type: object
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string }
        status:
          type: string
          description: Provider-specific status; clients must display unfamiliar values too.
        used: { type: number }
        limit: { type: number }
        remaining: { type: number }
        unit: { type: string }
        percentUsed: { type: number, minimum: 0 }
        windowSeconds: { type: integer, minimum: 0 }
        resetsAt: { type: string, format: date-time }
        thresholds:
          type: array
          items:
            type: object
            required: [label]
            properties:
              label: { type: string }
              value: { type: number }
              unit: { type: string }
              status: { type: string }
        details:
          type: object
          additionalProperties: true
          description: All other information reported for this quota, without folding different windows or models together.

    HandoffPreview:
      type: object
      required: [fromRunId, backend, canMove, reasons, warnings, missingSkills, workingDirectory, nativeSessionTransferred]
      properties:
        fromRunId: { $ref: "#/components/schemas/UUID" }
        backend: { $ref: "#/components/schemas/BackendInstance" }
        canMove: { type: boolean }
        reasons: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        missingSkills: { type: array, items: { type: string } }
        nativeSessionTransferred: { type: boolean, const: false }
        workingDirectory:
          type: object
          required: [resolution]
          properties:
            knownDirectoryId: { $ref: "#/components/schemas/UUID" }
            name: { type: string }
            path: { type: string }
            resolution: { type: string, enum: [bound, resolve, backend_default] }

    Handoff:
      type: object
      description: What moving a Session to another BackendInstance produced.
      required: [run]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        missingSkills:
          type: array
          items: { type: string }
          description: |
            The backend-local Skills the previous backend had and the new one
            does not. Core knows their names and never their content, so this is
            the most it can say.

    Task:
      type: object
      required: [id, projectId, title, status, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        projectId: { $ref: "#/components/schemas/UUID" }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        dependsOn:
          type: array
          items: { $ref: "#/components/schemas/UUID" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }

    Decision:
      type: object
      description: A durable fact or decision. Without a projectId it is global to the authenticated user's projects on this Core.
      required: [id, title, importance, status, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        projectId:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: Absent for a global Decision.
        title: { type: string }
        content: { type: string }
        importance: { $ref: "#/components/schemas/DecisionImportance" }
        status: { $ref: "#/components/schemas/DecisionStatus" }
        supersedes: { $ref: "#/components/schemas/UUID" }
        createdByJobId:
          allOf: [{ $ref: "#/components/schemas/UUID" }]
          description: >-
            The Job whose agent recorded this Decision through the
            decision_create Core Tool; absent when a person recorded it. An
            IMPORTANT Decision is carried into every later run, so a client
            shows which ones an agent wrote. The identifier is kept when the
            Job is deleted with its Session, and may then name no Job.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Artifact:
      type: object
      description: A stored blob. Metadata in PostgreSQL, bytes in S3-compatible storage.
      required: [id, ownerId, projectId, filename, mimeType, size, sha256, createdAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        ownerId: { type: string }
        projectId: { $ref: "#/components/schemas/UUID" }
        filename:
          type: string
          description: Metadata only. The object key is derived from identifiers.
        mimeType: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        sessionId: { $ref: "#/components/schemas/UUID" }
        jobId: { $ref: "#/components/schemas/UUID" }
        createdAt: { type: string, format: date-time }

    SkillSource:
      type: object
      description: What was asked for. Provenance, kept beside what was actually installed.
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/SkillSourceType" }
        url: { type: string }
        path:
          type: string
          description: Selects a subdirectory of the repository or archive.
        revision:
          type: string
          description: The requested branch, tag or commit. It may move; installedRevision never does.

    Skill:
      type: object
      description: |
        A Core-managed Skill, an immutable versioned artefact with provenance.
        Without a projectId it is global: every Project of its owner uses it
        unless the Project turned it off or has a Skill of the same name.
      required: [id, ownerId, name, source, installedRevision, installedAt, artifactId, bundleSha256, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        ownerId: { type: string }
        projectId:
          $ref: "#/components/schemas/UUID"
          description: The Project the Skill belongs to; absent for a global Skill.
        disabledProjectIds:
          type: array
          items: { $ref: "#/components/schemas/UUID" }
          description: The Projects that turned this global Skill off. Only in the list of global Skills.
        name: { type: string }
        description: { type: string }
        source: { $ref: "#/components/schemas/SkillSource" }
        installedRevision:
          type: string
          description: >-
            The immutable identity of what was installed: a commit, or a
            content hash.
        installedAt: { type: string, format: date-time }
        artifactId: { $ref: "#/components/schemas/UUID" }
        bundleSha256: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SkillFile:
      type: object
      required: [path, size]
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
        text:
          type: string
          description: The content, when the file is text and small enough to show.

    BackendSkill:
      type: object
      description: A Skill that exists only on one BackendInstance. Core knows its metadata and never its content.
      required: [backendInstanceId, name, available, reportedAt]
      properties:
        backendInstanceId: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        description: { type: string }
        available: { type: boolean }
        reportedAt: { type: string, format: date-time }

    AuditEntry:
      type: object
      description: |
        One recorded decision or privileged action. Its subject identifiers are
        plain text rather than foreign keys, so the record survives the deletion
        of what it describes.
        Account-scoped backend actions include backend.registered, backend.claimed,
        backend.revoked and backend.availability_changed. The backend actor uses
        backend:<id> and channel backend; Core-inferred OFFLINE uses actor/channel
        core. Detail retains name and, for availability, from/to/providerAuthState.
        Shared-key registration history is attached at claim with registeredAt.
        Credentials, registration tokens and claim codes are never included.
      required: [id, ownerId, actorId, action, createdAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        ownerId: { type: string }
        actorId: { type: string }
        action: { type: string, examples: ["execution_policy.set", "session.backend_changed"] }
        projectId: { $ref: "#/components/schemas/UUID" }
        sessionId: { $ref: "#/components/schemas/UUID" }
        jobId: { $ref: "#/components/schemas/UUID" }
        subjectId: { type: string }
        channel: { $ref: "#/components/schemas/Channel" }
        payloadSha256: { type: string }
        detail:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
