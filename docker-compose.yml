# Local development dependencies for Threavia Core.
#
# Core requires PostgreSQL and S3-compatible object storage
# (THREAVIA_SPEC_V1.md section 19). Garage is used here because it is small and
# convenient locally; nothing in Core or in the Helm chart assumes it.
#
# Every port is published on loopback only: the credentials below are fixed and
# public, and the rest of the network has no business reaching them.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: threavia
      POSTGRES_PASSWORD: threavia
      POSTGRES_DB: threavia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threavia -d threavia"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage is a V1 infrastructure requirement but the first vertical
  # slice runs without it, so it sits behind a profile: `make dev-up` starts only
  # what Core actually needs. Run `make dev-up-storage` to add it.
  objectstore:
    profiles: ["objectstore"]
    image: dxflrs/garage:v2.1.0
    ports:
      - "127.0.0.1:3900:3900"   # S3 API
      - "127.0.0.1:3903:3903"   # admin API
    volumes:
      - ./deploy/dev/garage.toml:/etc/garage.toml:ro
      - objectstore-meta:/var/lib/garage/meta
      - objectstore-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The web client, served by Vite with hot reload (spec section 5).
  #
  # It sits behind a profile because Core serves the built client on its own:
  # this is for working on the client itself. `make dev-web` starts it, and
  # everything it calls is proxied to Core, so the browser stays on one origin
  # and the event stream behaves as it does in production.
  #
  # Host networking, because Core runs on the host rather than in compose: it
  # needs a terminal, a debugger and a rebuild loop of its own. Reaching the
  # host from a bridge network means host.docker.internal and an open firewall
  # on the docker interface, which is one more thing to get right on every
  # machine; sharing the host namespace has nothing to get right. Set
  # THREAVIA_CORE_URL to point somewhere else.
  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: deploy/docker/web-dev.Dockerfile
    network_mode: "host"
    environment:
      THREAVIA_CORE_URL: "${THREAVIA_CORE_URL:-http://localhost:8080}"
    volumes:
      - ./web/ui:/app
      # Keeps the image's node_modules, which the mount above would otherwise
      # hide behind an empty host directory.
      - web-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5173/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  objectstore-meta:
  objectstore-data:
  web-node-modules:
