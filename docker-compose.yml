# Local development dependencies for Threavia Core.
#
# Core requires PostgreSQL and S3-compatible object storage
# (THREAVIA_SPEC_V1.md section 19). Garage is used here because it is small and
# convenient locally; nothing in Core or in the Helm chart assumes it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: threavia
      POSTGRES_PASSWORD: threavia
      POSTGRES_DB: threavia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threavia -d threavia"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage is a V1 infrastructure requirement but the first vertical
  # slice runs without it, so it sits behind a profile: `make dev-up` starts only
  # what Core actually needs. Run `make dev-up-storage` to add it.
  objectstore:
    profiles: ["objectstore"]
    image: dxflrs/garage:v2.1.0
    ports:
      - "3900:3900"   # S3 API
      - "3903:3903"   # admin API
    volumes:
      - ./deploy/dev/garage.toml:/etc/garage.toml:ro
      - objectstore-meta:/var/lib/garage/meta
      - objectstore-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  objectstore-meta:
  objectstore-data:
