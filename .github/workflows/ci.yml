name: "CI"

on:
  push:
    branches:
      - "master"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - "master"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"
  # A pull request is checked out detached, so the comparison target has to be
  # the remote-tracking branch.
  DEFAULT_BRANCH: "origin/master"

jobs:
  lint:
    name: "Lint"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          # buf compares the protocol against the default branch, which needs
          # the history that branch lives in.
          fetch-depth: 0

      - name: "Set up Go"
        uses: "actions/setup-go@v7.0.0"
        with:
          go-version-file: "go.mod"
          cache: true

      - name: "Cache the pinned code generation tools"
        id: "tools"
        uses: "actions/cache@v6.1.0"
        with:
          path: "~/go/bin"
          key: "tools-${{ runner.os }}-${{ hashFiles('Makefile') }}"

      - name: "Install the pinned code generation tools"
        if: "steps.tools.outputs.cache-hit != 'true'"
        run: "make tools"

      - name: "Set up Node"
        uses: "actions/setup-node@v6.0.0"
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/ui/package-lock.json"

      - name: "Install the web client dependencies"
        run: "make web-deps"

      - name: "Check formatting"
        run: "make fmt-check"

      - name: "Check that go.mod and go.sum are tidy"
        run: "make tidy-check"

      - name: "Check that the generated code is up to date"
        run: "make generate-check"

      - name: "Check that the TypeScript API types match the contract"
        run: "make web-generate-check"

      - name: "Lint"
        run: "make lint"

      - name: "Type-check and lint the web client"
        run: "make web-lint"

      - name: "Check that the demo answers every call of the client"
        run: "make web-demo-check"

      - name: "Check the protocol for breaking changes"
        # A tag is cut from the default branch, so there is nothing to compare.
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: "make proto-breaking"

  tests:
    name: "Tests"
    runs-on: "ubuntu-latest"

    services:
      postgres:
        image: "postgres:17-alpine"
        env:
          POSTGRES_USER: "threavia"
          POSTGRES_PASSWORD: "threavia"
          POSTGRES_DB: "threavia"
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U threavia -d threavia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Set up Go"
        uses: "actions/setup-go@v7.0.0"
        with:
          go-version-file: "go.mod"
          cache: true

      # The race detector is ThreadSanitizer, so it needs cgo and a C compiler.
      # The database integration and end-to-end tests skip without a database,
      # so the URL is what actually runs them.
      - name: "Run the tests under the race detector"
        env:
          THREAVIA_TEST_POSTGRES_URL: "postgres://threavia:threavia@localhost:5432/threavia?sslmode=disable"
          CGO_ENABLED: "1"
        run: "go test -race ./..."

  web:
    name: "Web client"
    runs-on: "ubuntu-latest"
    needs: ["lint"]

    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Set up Node"
        uses: "actions/setup-node@v6.0.0"
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web/ui/package-lock.json"

      # Built once and shared: the output is static files, identical for every
      # operating system and architecture the matrix below builds for.
      - name: "Build the web client"
        run: "make web"

      - name: "Upload the built client"
        uses: "actions/upload-artifact@v7.0.1"
        with:
          name: "web-client"
          path: "web/ui/dist"
          retention-days: 7
          include-hidden-files: true

  vscode:
    name: "VS Code extension"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0

      - name: "Set up Node"
        uses: "actions/setup-node@v6.0.0"
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "clients/vscode/package-lock.json"

      # The API types are generated from the contract, so a stale copy fails
      # here like the web client's does.
      - name: "Check, lint and test the extension"
        run: "make vscode-check"

      - name: "Get version"
        run: |
          # The same version as the binaries and the chart, so a .vsix says
          # which Core it was built with.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            described="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
            if [ -n "${described}" ]; then
              version="${described#v}"
            else
              version="0.0.0-$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
            fi
          fi
          echo "version=${version}" >> "${GITHUB_ENV}"

      # Packaged on every run, so a manifest vsce refuses is caught before
      # release day.
      - name: "Package the extension"
        working-directory: "clients/vscode"
        run: |
          npm version "${version}" --no-git-tag-version --allow-same-version
          npm run package
          mv threavia.vsix "threavia-${version}.vsix"

      - name: "Upload the extension"
        uses: "actions/upload-artifact@v7.0.1"
        with:
          name: "vscode-extension"
          path: "clients/vscode/*.vsix"
          retention-days: 7

  # The flake is how a NixOS machine installs a backend, and nothing else here
  # would notice it breaking: the package pins a hash over the Go module graph,
  # so adding a dependency makes it stale, and the error lands on the person
  # rebuilding their laptop rather than on the commit that caused it.
  nix:
    name: "Nix"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Set up Nix"
        uses: "cachix/install-nix-action@v31"
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: "Cache the Nix store"
        uses: "DeterminateSystems/magic-nix-cache-action@v13"

      # Builds the backend and evaluates the NixOS module against it, which is
      # what catches a renamed option or a setting the backend stopped reading.
      - name: "Check the flake"
        run: "nix flake check --print-build-logs"

  build:
    name: "Build"
    runs-on: "ubuntu-latest"
    needs: ["lint", "tests", "web"]

    strategy:
      matrix:
        include:
          - goos: "linux"
            goarch: "amd64"
          - goos: "linux"
            goarch: "arm64"
          - goos: "darwin"
            goarch: "amd64"
          - goos: "darwin"
            goarch: "arm64"

    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0

      - name: "Set up Go"
        uses: "actions/setup-go@v7.0.0"
        with:
          go-version-file: "go.mod"
          cache: true

      # The client this run built, embedded by the Go build below. The
      # repository carries none, so without this the binary would ship the
      # "not built" page.
      - name: "Download the built client"
        uses: "actions/download-artifact@v8.0.1"
        with:
          name: "web-client"
          path: "web/ui/dist"

      - name: "Get version"
        run: |
          # The version has to be a valid semantic version: Helm refuses
          # anything else, and a bare commit sha is not one. Leaving --always
          # out is what makes this empty when no tag matches, so the fallback
          # below applies instead of a sha leaking through.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            described="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
            if [ -n "${described}" ]; then
              version="${described#v}"
            else
              version="0.0.0-$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
            fi
          fi
          echo "version=${version}" >> "${GITHUB_ENV}"

      - name: "Build the binaries"
        env:
          GOOS: "${{ matrix.goos }}"
          GOARCH: "${{ matrix.goarch }}"
          # Nothing in the tree uses cgo, so every target cross-compiles.
          CGO_ENABLED: "0"
        run: |
          out="dist/threavia_${version}_${GOOS}_${GOARCH}"
          mkdir -p "${out}"
          for cmd in threavia-core threavia-backend-claude; do
            go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "${out}/${cmd}" "./cmd/${cmd}"
          done
          cp README.md LICENSE NOTICE "${out}/"
          tar -czf "dist/threavia_${version}_${GOOS}_${GOARCH}.tar.gz" -C dist "$(basename "${out}")"

      - name: "Upload the archive"
        uses: "actions/upload-artifact@v7.0.1"
        with:
          name: "threavia_${{ matrix.goos }}_${{ matrix.goarch }}"
          path: "dist/*.tar.gz"
          retention-days: 7

  package:
    name: "Package"
    runs-on: "ubuntu-latest"
    needs: ["build"]

    permissions:
      contents: "read"
      packages: "write"

    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0

      - name: "Get version"
        run: |
          # Identical to the build job: the chart and the image tags have to
          # agree, and both have to be a valid semantic version.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            described="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
            if [ -n "${described}" ]; then
              version="${described#v}"
            else
              version="0.0.0-$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
            fi
          fi
          echo "version=${version}" >> "${GITHUB_ENV}"

      - name: "Set up QEMU"
        uses: "docker/setup-qemu-action@v4.4.0"

      - name: "Set up Buildx"
        uses: "docker/setup-buildx-action@v4.4.1"

      # Images and the chart are published on a tag only; every other run still
      # builds them, so a broken Dockerfile is caught before release day.
      - name: "Log in to the registry"
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: "docker/login-action@v4.6.0"
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Build the Core image"
        uses: "docker/build-push-action@v7.4.0"
        with:
          context: "."
          file: "deploy/docker/core.Dockerfile"
          platforms: "${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}"
          build-args: "VERSION=${{ env.version }}"
          push: "${{ startsWith(github.ref, 'refs/tags/v') }}"
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/threavia-core:${{ env.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/threavia-core:latest
          cache-from: "type=gha,scope=core"
          cache-to: "type=gha,scope=core,mode=max"

      - name: "Build the Claude backend image"
        uses: "docker/build-push-action@v7.4.0"
        with:
          context: "."
          file: "deploy/docker/backend-claude.Dockerfile"
          platforms: "${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}"
          build-args: "VERSION=${{ env.version }}"
          push: "${{ startsWith(github.ref, 'refs/tags/v') }}"
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/threavia-backend-claude:${{ env.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/threavia-backend-claude:latest
          cache-from: "type=gha,scope=backend-claude"
          cache-to: "type=gha,scope=backend-claude,mode=max"

      - name: "Set up Helm"
        uses: "azure/setup-helm@v5.0.1"

      - name: "Package the Helm charts"
        run: |
          for chart in threavia threavia-backend-claude; do
            helm lint "deploy/helm/${chart}"

            # Helm reads every YAML number as a float, and a float big enough
            # renders as 1.048576e+08 — which the binary rejects at startup,
            # four minutes into a deployment. lint says nothing about it, so
            # the rendered output is what gets checked.
            if helm template check "deploy/helm/${chart}" --set s3.enabled=true |
                 grep -nE 'value: "[0-9.]+e\+[0-9]+"'; then
              echo "::error::${chart} renders a number in scientific notation, wrap it in int64"
              exit 1
            fi

            # Core without authentication attributes every request to one
            # user, so its chart must refuse to publish the client API.
            if [ "${chart}" = threavia ] &&
                 helm template check "deploy/helm/${chart}" \
                   --set auth.mode=none --set ingress.http.enabled=true >/dev/null 2>&1; then
              echo "::error::${chart} renders an HTTP ingress with auth.mode none"
              exit 1
            fi

            helm package "deploy/helm/${chart}" \
              --version "${version}" --app-version "${version}" --destination dist
          done

      - name: "Push the Helm charts"
        if: "startsWith(github.ref, 'refs/tags/v')"
        run: |
          helm registry login "${REGISTRY}" \
            --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}"
          for chart in threavia threavia-backend-claude; do
            helm push "dist/${chart}-${version}.tgz" \
              "oci://${REGISTRY}/${{ github.repository_owner }}/charts"
          done

      - name: "Upload the charts"
        uses: "actions/upload-artifact@v7.0.1"
        with:
          name: "helm-chart"
          path: "dist/*.tgz"
          retention-days: 7

  # The extension goes to the VS Code Marketplace from the .vsix the vscode job
  # built, so what is published is byte for byte what the release attaches.
  #
  # There is no publishing secret: the job signs in to Microsoft Entra ID as
  # an identity that trusts this repository's marketplace-publish environment
  # (a federated credential), and that identity is a Contributor of the
  # rclsilver publisher. The token it gets lives about an hour, for this job.
  # Until the identity exists, the repository variable VSCODE_MARKETPLACE is
  # unset and the job does not run.
  marketplace:
    name: "Publish the VS Code extension"
    runs-on: "ubuntu-latest"
    needs: ["vscode"]
    if: "startsWith(github.ref, 'refs/tags/v') && vars.VSCODE_MARKETPLACE == 'true'"
    environment: "marketplace-publish"

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: "Download the extension"
        uses: "actions/download-artifact@v8.0.1"
        with:
          name: "vscode-extension"
          path: "dist"

      - name: "Sign in to Microsoft Entra ID"
        uses: "azure/login@v3.1.0"
        with:
          client-id: "${{ secrets.AZURE_CLIENT_ID }}"
          tenant-id: "${{ secrets.AZURE_TENANT_ID }}"
          # The identity needs no Azure resource, only a token for the
          # Marketplace, so it has no subscription to select.
          allow-no-subscriptions: true

      - name: "Publish"
        run: |
          # Checked first, so a lost membership reads as one rather than as a
          # failed upload.
          npx --yes @vscode/vsce@3.6.2 verify-pat rclsilver --azure-credential
          # A tag published twice — a rerun of this job — is not a failure.
          npx --yes @vscode/vsce@3.6.2 publish --packagePath dist/*.vsix --azure-credential --skip-duplicate

  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: ["package", "vscode"]
    if: "startsWith(github.ref, 'refs/tags/v')"

    permissions:
      contents: "write"

    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Download every artifact"
        uses: "actions/download-artifact@v8.0.1"
        with:
          path: "dist"
          merge-multiple: true

      - name: "Checksum the archives"
        run: |
          cd dist
          sha256sum *.tar.gz *.tgz *.vsix > SHA256SUMS
          cat SHA256SUMS

      - name: "Publish the release"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          version="${GITHUB_REF#refs/tags/}"
          owner="${{ github.repository_owner }}"
          cat > notes.md <<EOF
          ## Container images

          \`\`\`
          ghcr.io/${owner}/threavia-core:${version#v}
          ghcr.io/${owner}/threavia-backend-claude:${version#v}
          \`\`\`

          ## Helm chart

          \`\`\`
          helm install threavia oci://ghcr.io/${owner}/charts/threavia --version ${version#v}
          helm install laptop oci://ghcr.io/${owner}/charts/threavia-backend-claude --version ${version#v}
          \`\`\`

          ## VS Code extension

          \`\`\`
          code --install-extension threavia-${version#v}.vsix
          \`\`\`

          Binaries for linux and darwin, amd64 and arm64, and the VS Code
          extension are attached with their checksums.
          EOF
          # Named rather than globbed: every artifact of the run lands in dist/,
          # and the built web client brings an assets/ directory with it. A bare
          # dist/* hands that directory to the uploader, which fails on it after
          # the release has already been created.
          gh release create "${version}" \
            dist/*.tar.gz dist/*.tgz dist/*.vsix dist/SHA256SUMS \
            --title "${version}" \
            --notes-file notes.md \
            --verify-tag
