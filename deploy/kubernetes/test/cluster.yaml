apiVersion: v1
kind: Pod
metadata:
  name: prepare
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: prepare
      image: threavia-execution-test:local
      imagePullPolicy: Never
      command: [bash, -c, 'mkdir -p /shared/skills/bundles /shared/skills/jobs /shared/scratch /workspace/project; printf sentinel > /workspace/sentinel']
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumeMounts:
        - {name: shared, mountPath: /shared}
        - {name: workspace, mountPath: /workspace}
  volumes:
    - name: shared
      persistentVolumeClaim: {claimName: shared}
    - name: workspace
      persistentVolumeClaim: {claimName: workspaces}
---
apiVersion: v1
kind: Pod
metadata:
  name: echo
  labels: {app: echo}
spec:
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: echo
      image: threavia-execution-test:local
      imagePullPolicy: Never
      command: [/usr/local/bin/fixture-provider, --echo-server]
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      ports: [{containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: echo}
spec:
  selector: {app: echo}
  ports: [{port: 8080, targetPort: 8080}]
