{{- $createSecret := or
      (and (not .Values.postgres.existingSecret) .Values.postgres.password)
      (and .Values.s3.enabled (not .Values.s3.existingSecret) .Values.s3.secretAccessKey)
      (and (eq .Values.auth.mode "basic") (not .Values.auth.basic.existingSecret) .Values.auth.basic.password) }}
{{- if $createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "threavia.secretName" . }}
  labels:
    {{- include "threavia.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not .Values.postgres.existingSecret) .Values.postgres.password }}
  postgresPassword: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- if and .Values.s3.enabled (not .Values.s3.existingSecret) }}
  s3AccessKeyId: {{ .Values.s3.accessKeyId | quote }}
  s3SecretAccessKey: {{ .Values.s3.secretAccessKey | quote }}
  {{- end }}
  {{- if and (eq .Values.auth.mode "basic") (not .Values.auth.basic.existingSecret) }}
  basicPassword: {{ .Values.auth.basic.password | quote }}
  {{- end }}
{{- end }}
