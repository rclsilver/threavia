{{- if and .Values.backendRegistration.sharedKey.enabled (not .Values.backendRegistration.sharedKey.existingSecret) }}
{{- $name := printf "%s-registration" (include "threavia.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.backendRegistration.sharedKey.existingSecretKey }}
{{- $value := "" }}
{{- if and $existing (index $existing.data $key) }}
{{- /* Preserve the key already installed: it is the source of truth and
       rotating it would orphan every registered backend. */}}
{{- $value = index $existing.data $key }}
{{- else }}
{{- /* 32 bytes / 256 bits from a CSPRNG, generated once on first install. */}}
{{- $value = randBytes 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "threavia.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $value }}
{{- end }}
