{{- if .Values.ingress.http.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "threavia.fullname" . }}
  labels:
    {{- include "threavia.labels" . | nindent 4 }}
  {{- with .Values.ingress.http.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.http.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.http.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.http.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "threavia.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
---
{{- if .Values.ingress.grpc.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "threavia.fullname" . }}-grpc
  labels:
    {{- include "threavia.labels" . | nindent 4 }}
  {{- with .Values.ingress.grpc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.grpc.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.grpc.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.grpc.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "threavia.fullname" . }}
                port:
                  name: grpc
{{- end }}
